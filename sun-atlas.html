<header class="pagehead reveal is-in" style="--reveal-delay: 0ms;"><p class="kicker">Sunday, August 2</p><h1>Atlas Stage</h1><div class="pagehead__meta"><span>14 talks · 3 sessions</span><a href="https://www.youtube.com/watch?v=LGW_6P1CMC8" target="_blank" rel="noopener"><span class="material-symbols-rounded" aria-hidden="true">play_circle</span>Morning stream</a><a href="https://www.youtube.com/watch?v=-7AJJLwYW1Q" target="_blank" rel="noopener"><span class="material-symbols-rounded" aria-hidden="true">play_circle</span>Afternoon stream</a></div></header><div class="controls"><div class="searchwrap"><span class="material-symbols-rounded" aria-hidden="true">search</span><input id="search" type="search" placeholder="Search talks, speakers, topics…" value="" aria-label="Search talks, speakers, topics…"></div><div class="chiprow"><button class="chip active" data-filter="all" aria-pressed="true">All</button><button class="chip" data-filter="keynote" aria-pressed="false">Keynote</button><button class="chip" data-filter="talk" aria-pressed="false">Talk</button><button class="chip" data-filter="workshop" aria-pressed="false">Workshop</button><span class="result-count">14 / 14 talks</span></div></div><section class="session-group"><div class="session-head"><span class="session-head__half">AM</span><span class="session-head__label">Session 1: Enterprise AI</span></div><button class="card talkrow reveal is-in" data-item="" data-slug="sunita-verma--rate-limiter-on-ai-adoption-is-organizational" type="button" style="--reveal-delay: 45ms;"><span class="talkrow__time">00:00</span><span class="talkrow__main"><span class="talkrow__title">Rate Limiter on AI Adoption Is Organizational</span><span class="talkrow__speaker" style="display:block"><strong>Sunita Verma</strong> · Chief Technology Officer, Ironclad</span><span class="talkrow__summary">Enterprise AI stalls on people and process, not on model capability — Ironclad's answer was to upskill every function simultaneously, treat education as infrastructure, and move spec-writing to the front of the process so agents get well-specified work.</span></span><span class="badge badge--keynote">Keynote</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="ori-goshen--self-optimizing-agents" type="button" style="--reveal-delay: 90ms;"><span class="talkrow__time">00:18</span><span class="talkrow__main"><span class="talkrow__title">Self Optimizing Agents</span><span class="talkrow__speaker" style="display:block"><strong>Ori Goshen</strong> · Co-Founder &amp; CEO, AI21 Labs</span><span class="talkrow__summary">Once agents reach production the binding constraint is operating economically at the frontier, and the configuration space — models, retrieval, scaling, model portfolios, execution strategies — is far too large to search by hand, so optimization has to be automated, observable, and robust to the next model release.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="rene-pajta--the-enterprise-version-of-the-one-person-unicorn" type="button" style="--reveal-delay: 135ms;"><span class="talkrow__time">00:35</span><span class="talkrow__main"><span class="talkrow__title">The Enterprise Version of the One-Person Unicorn</span><span class="talkrow__speaker" style="display:block"><strong>Rene Pajta</strong> · Chief Architect Cloud &amp; AI, Microsoft</span><span class="talkrow__summary">The enterprise analogue of the one-person unicorn isn't headcount reduction — it's everyone operating like a CEO with their own bench of agents; what blocks it isn't models but company intelligence, which is the only real moat while models, harnesses, and connectors are commodities to buy.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="vincent-sunn-chen--the-art-and-science-of-benchmarking-agents" type="button" style="--reveal-delay: 180ms;"><span class="talkrow__time">00:46</span><span class="talkrow__main"><span class="talkrow__title">The Art &amp; Science of Benchmarking Agents</span><span class="talkrow__speaker" style="display:block"><strong>Vincent Sunn Chen</strong> · VP &amp; Founding Member, Snorkel AI</span><span class="talkrow__summary">Our ability to measure AI has been outpaced by our ability to build it, and "bench slop" — vibe-coding a benchmark for a nice Twitter post — makes it worse; benchmarks that last need a thesis about the frontier, a roadmap the community can build on, and near-obsessive task quality control, which is how Snorkel built Senior SWE-Bench.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="dan-klein--superintelligence-vs-super-reliability" type="button" style="--reveal-delay: 225ms;"><span class="talkrow__time">00:59</span><span class="talkrow__main"><span class="talkrow__title">Superintelligence vs. Super-Reliability</span><span class="talkrow__speaker" style="display:block"><strong>Dan Klein</strong> · Professor, UC Berkeley; Co-founder &amp; CTO, Scaled Cognition</span><span class="talkrow__summary">Intelligence is multifaceted and its facets are not advancing at the same rate — breadth, plasticity, and fluency are through the roof while precise verifiable control and explainability lag badly. Demos need only the former; shippable products need the latter, and that mismatch is the structural reason the last mile keeps failing.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="workshop--from-assistants-to-ai-employees" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">01:12</span><span class="talkrow__main"><span class="talkrow__title">From Assistants to AI Employees: Designing Agents That Own a Role, Not a Task</span><span class="talkrow__speaker" style="display:block"><strong>Anushka Pathak, Soham Shah, Eric Victorson</strong> · Product Manager / ML Engineer / Software Engineer, Ema</span><span class="talkrow__summary">Assistants are reactive, stateless, and leave governance to the user; Ema's argument is to design agents as "AI employees" — triggered by events and schedules, acting on real systems under scoped permissions, holding state across days and systems, with governance built in — and the real blocker in deployment is never whether the agent can do the whole job, it's the humans collaborating with it.</span></span><span class="badge badge--workshop">Workshop</span></button></section><section class="session-group"><div class="session-head"><span class="session-head__half">PM</span><span class="session-head__label">Session 2: Agent Evaluation &amp; Benchmarks</span></div><button class="card talkrow reveal" data-item="" data-slug="anastasios-angelopoulos--agent-arena-causal-evaluations-of-agents-in-the-real-world" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">00:00</span><span class="talkrow__main"><span class="talkrow__title">Agent Arena: Causal Evaluations of Agents in the Real World</span><span class="talkrow__speaker" style="display:block"><strong>Anastasios N Angelopoulos</strong> · Co-Founder/CEO, LLMArena</span><span class="talkrow__summary">Static benchmarks get overfit and drift away from production, so the only judge that can't be gamed is reality — Arena randomizes the model inside millions of weekly organic agentic traces and reports causal treatment effects, not scores, as its agent leaderboard.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="michal-shmueli-scheuer--ready-for-general-agents-lets-test-it" type="button" style="--reveal-delay: 0ms;"><span class="talkrow__time">00:13</span><span class="talkrow__main"><span class="talkrow__title">Ready for General Agents? Let's Test It.</span><span class="talkrow__speaker" style="display:block"><strong>Michal Shmueli-Scheuer</strong> · Distinguished Engineer, AI Benchmarking and Evaluation, IBM Research</span><span class="talkrow__summary">The bitter lesson says generality wins, agents included — but proving an agent is general first requires standardizing three interfaces (agent, environment, researcher). IBM's answer is a Unified Protocol mediation layer (Exgentic) that lets any agent run any benchmark unmodified, and the resulting leaderboard shows general agents are already competitive with the top domain-specific agent on each task.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="priya-ponnapalli--building-reliable-agents-an-evals-first-approach" type="button" style="--reveal-delay: 45ms;"><span class="talkrow__time">00:27</span><span class="talkrow__main"><span class="talkrow__title">Building Reliable Agents: An Evals-First Approach</span><span class="talkrow__speaker" style="display:block"><strong>Priya Ponnapalli</strong> · SVP of Engineering, Enterprise AI, Scale AI</span><span class="talkrow__summary">Enterprise agents use inherently stochastic technology to deliver deterministic business outcomes, so "mostly right" is a liability. Scale's answer is a four-layer eval framework — L0 business outcomes, L1 task success, L2 components, L3 diagnostics — kept separate but causally linked, with the eval suite treated as the customer's most durable asset.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="srijith-rajamohan--spec-driven-agents-hierarchical-specs-tooling-and-trajectory-based-evaluation" type="button" style="--reveal-delay: 90ms;"><span class="talkrow__time">00:39</span><span class="talkrow__main"><span class="talkrow__title">Spec-Driven Agents: Hierarchical Specs, Tooling, and Trajectory-Based Evaluation</span><span class="talkrow__speaker" style="display:block"><strong>Srijith Rajamohan</strong> · Head of AI Research, Redis</span><span class="talkrow__summary">Lessons from building a diagnostic agent for the Redis Query Engine — what moved the needle wasn't a stronger model but restructuring the tools (setup vs. discretionary) and the knowledge (a diagnostic playbook of router plus handbooks); and most failure modes are invisible in the final answer and only show up in the trajectory.</span></span><span class="badge badge--talk">Talk</span></button></section><section class="session-group"><div class="session-head"><span class="session-head__half">PM</span><span class="session-head__label">Session 3: AI for Math</span></div><button class="card talkrow reveal" data-item="" data-slug="sergei-gukov--the-future-of-ai-for-long-horizon-and-sparse-reward-tasks" type="button" style="--reveal-delay: 135ms;"><span class="talkrow__time">00:50</span><span class="talkrow__main"><span class="talkrow__title">The Future of AI for Long-Horizon and Sparse-Reward Tasks</span><span class="talkrow__speaker" style="display:block"><strong>Sergei Gukov</strong> · Executive Director, American Institute of Mathematics; John D. MacArthur Professor of Theoretical Physics and Mathematics, Caltech</span><span class="talkrow__summary">Math is the most honest benchmark for AI, and what actually blocks mass-producing solutions to hard math problems isn't knowledge but the combination of long horizons and sparse rewards. A decade of fixes — curiosity modules, world models, harnesses — buys a few x or 10x when these problems need orders of magnitude. The next era's bottleneck is not the data stack but the reward stack.</span></span><span class="badge badge--keynote">Keynote</span></button><button class="card talkrow reveal" data-item="" data-slug="lijie-chen--the-unit-distance-conjecture-and-ai-for-math" type="button" style="--reveal-delay: 180ms;"><span class="talkrow__time">01:05</span><span class="talkrow__main"><span class="talkrow__title">The Unit Distance Conjecture and AI for Math</span><span class="talkrow__speaker" style="display:block"><strong>Lijie Chen</strong> · Researcher, OpenAI</span><span class="talkrow__summary">The Erdős unit distance conjecture from 1946 was disproved not by a math-specialized model but by a general reasoning model with no harness and a single prompt. Its edge wasn't depth — it was simultaneous fluency in two distant mathematical fields, which is exactly the most expensive thing for a human mathematician to acquire.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="vijay-ganesh--semantic-alignment-models-for-math-and-software-engineering" type="button" style="--reveal-delay: 225ms;"><span class="talkrow__time">01:17</span><span class="talkrow__main"><span class="talkrow__title">Semantic Alignment Models for Math and Software Engineering</span><span class="talkrow__speaker" style="display:block"><strong>Vijay Ganesh</strong> · Professor, Georgia Institute of Technology</span><span class="talkrow__summary">For autoformalization — a cross-modal task where semantic content must be preserved exactly — the win isn't scale but training the property of semantic alignment directly into the embedding space: objects with the same semantic content sit close together, different ones far apart. That recipe produced a model 1000× smaller than frontier models that beat them on every benchmark tested.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="workshop--omnigent-meta-harness" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">01:30</span><span class="talkrow__main"><span class="talkrow__title">Omnigent - A Meta Harness for AI Agents</span><span class="talkrow__speaker" style="display:block"><strong>Aravind Segu</strong> · Software Engineer, Databricks</span><span class="talkrow__summary">Adopting agents is easy; operating them is not. Databricks' answer is an open-source layer above the harness — sessions live on a server, work happens on a runner — so one session can compose across harnesses, be co-driven by teammates, be governed by policy, and keep running after you close your laptop.</span></span><span class="badge badge--workshop">Workshop</span></button></section>
