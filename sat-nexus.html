<header class="pagehead reveal is-in" style="--reveal-delay: 0ms;"><p class="kicker">Saturday, August 1</p><h1>Nexus Stage</h1><div class="pagehead__meta"><span>23 talks · 4 sessions</span><a href="https://www.youtube.com/watch?v=LB7IkZhEYic" target="_blank" rel="noopener"><span class="material-symbols-rounded" aria-hidden="true">play_circle</span>Morning stream</a><a href="https://www.youtube.com/watch?v=ZIRc3EpzQJs" target="_blank" rel="noopener"><span class="material-symbols-rounded" aria-hidden="true">play_circle</span>Afternoon stream</a></div></header><div class="controls"><div class="searchwrap"><span class="material-symbols-rounded" aria-hidden="true">search</span><input id="search" type="search" placeholder="Search talks, speakers, topics…" value="" aria-label="Search talks, speakers, topics…"></div><div class="chiprow"><button class="chip active" data-filter="all" aria-pressed="true">All</button><button class="chip" data-filter="keynote" aria-pressed="false">Keynote</button><button class="chip" data-filter="talk" aria-pressed="false">Talk</button><button class="chip" data-filter="workshop" aria-pressed="false">Workshop</button><span class="result-count">23 / 23 talks</span></div></div><section class="session-group"><div class="session-head"><span class="session-head__half">AM</span><span class="session-head__label">Session 1: AI for Science</span></div><button class="card talkrow reveal is-in" data-item="" data-slug="markus-buehler--superintelligence-for-scientific-discovery" type="button" style="--reveal-delay: 45ms;"><span class="talkrow__time">00:06</span><span class="talkrow__main"><span class="talkrow__title">Superintelligence for Scientific Discovery: Multi-Agent Swarms and Large Reasoning Models</span><span class="talkrow__speaker" style="display:block"><strong>Markus J. Buehler</strong> · Professor, MIT; Founder &amp; CTO, Unreasonable Labs</span><span class="talkrow__summary">Real discovery isn't extending an existing paradigm — it's rewriting the grammar we use to describe the world, so Buehler builds agent systems designed to falsify themselves: a builder proposes an externalized world model, a breaker hunts for evidence that breaks it, and decentralized swarms push outside nature's distribution and pick their own problems.</span></span><span class="badge badge--keynote">Keynote</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="james-zou--harnessing-the-collective-intelligence-of-agents-for-science" type="button" style="--reveal-delay: 90ms;"><span class="talkrow__time">00:21</span><span class="talkrow__main"><span class="talkrow__title">Harnessing the Collective Intelligence of Agents for Science</span><span class="talkrow__speaker" style="display:block"><strong>James Zou</strong> · Professor, Stanford</span><span class="talkrow__summary">The new scaling axis isn't bigger individual models but more collaborating scientist agents — from ten to thousands to millions — which in turn requires rebuilding scientific data infrastructure for agents instead of humans.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="eric-ho--unlocking-scientific-abundance-by-learning-from-superhuman-ai" type="button" style="--reveal-delay: 135ms;"><span class="talkrow__time">00:32</span><span class="talkrow__main"><span class="talkrow__title">Unlocking Scientific Abundance by Learning from Superhuman AI</span><span class="talkrow__speaker" style="display:block"><strong>Eric Ho</strong> · Co-Founder/CEO, Goodfire</span><span class="talkrow__summary">Superhuman scientific models already know things humans don't; reverse-engineering their internal computations is the most direct way to move that knowledge back into human hands.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="andrew-schoen--solving-quantum-science-problems-with-smart" type="button" style="--reveal-delay: 180ms;"><span class="talkrow__time">00:47</span><span class="talkrow__main"><span class="talkrow__title">Solving Quantum Science Problems with SMART: A Self-evolving Multi-Agent Research Tree</span><span class="talkrow__speaker" style="display:block"><strong>Andrew Schoen</strong> · Partner, NEA(本場由 UC Berkeley 的 Mingu Kang 代為報告 / presented on his behalf by Mingu Kang, UC Berkeley)</span><span class="talkrow__summary">Agentic systems for discovery don't need longer loops, they need a research tree that rewrites itself — SMART builds nodes from planner/worker/verifier triples, lets the tree restructure as agents explore, and cuts atom-rearrangement time on neutral-atom quantum computers by 25–83%.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="mengdi-wang--labos-the-ai-xr-co-scientist" type="button" style="--reveal-delay: 225ms;"><span class="talkrow__time">01:03</span><span class="talkrow__main"><span class="talkrow__title">LabOS: The AI-XR Co-Scientist That Sees and Works With Humans</span><span class="talkrow__speaker" style="display:block"><strong>Mengdi Wang</strong> · Professor, Princeton</span><span class="talkrow__summary">The real bottleneck on scaling AI isn't hypotheses, it's verification — physical experiments have no checkpoints, no logs, and no way to backtrack — so Wang's answer is to put AI behind smart glasses in the lab and turn every physical action into an observable, debuggable environment.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="rose-yu--towards-ai-co-scientists" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">01:11</span><span class="talkrow__main"><span class="talkrow__title">Towards AI Co-Scientists: Agentic AI for Scientific Discovery</span><span class="talkrow__speaker" style="display:block"><strong>Rose Yu</strong> · Professor, UC San Diego; CEO/Co-Founder, GistFlow</span><span class="talkrow__summary">The physical world breaks three assumptions agentic systems are built on at once — tools are expensive, environments obey conservation laws, and the interesting events are rare and highly uncertain — so Yu grounds agents in physical law and lets them adaptively trade internal reasoning against simulations that take days.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="jonathan-welch--building-ai-for-the-physical-world" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">01:20</span><span class="talkrow__main"><span class="talkrow__title">Building AI for the Physical World: Lessons from Accelerating Discovery for Chemists Across the Globe</span><span class="talkrow__speaker" style="display:block"><strong>Jonathan Welch</strong> · Head of AI, Albert Invent</span><span class="talkrow__summary">In industrial chemistry the most important feature of an agentic co-scientist isn't accuracy, it's trust — and trust doesn't die in a dramatic reasoning failure, it dies quietly when a retrieval model ranks the right passage 300th because it has no discrimination inside the domain.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="workshop--token-efficient-openclaw" type="button" style="--reveal-delay: 0ms;"><span class="talkrow__time">01:26</span><span class="talkrow__main"><span class="talkrow__title">Building a Token-Efficient OpenClaw Agentic System</span><span class="talkrow__speaker" style="display:block"><strong>Mahdi Ghodsi、Satya Devineni、Eda Zhou</strong> · AI Solutions Architect, AMD;Product Application Engineer, AMD;Software Development Engineer, AMD</span><span class="talkrow__summary">Agentic work moves the unit of account from tokens per second to cost per finished task, and the two levers that lower it are tiered caching — stop recomputing what the last turn already computed — and model routing — stop sending "find me a file" to a frontier model.</span></span><span class="badge badge--workshop">Workshop</span></button></section><section class="session-group"><div class="session-head"><span class="session-head__half">PM</span><span class="session-head__label">Session 2: Coding &amp; Web Agents</span></div><button class="card talkrow reveal is-in" data-item="" data-slug="silas-alberti--scaling-rl-for-coding-agents" type="button" style="--reveal-delay: 45ms;"><span class="talkrow__time">00:13</span><span class="talkrow__main"><span class="talkrow__title">Scaling RL for Coding Agents - Lessons from Training SWE-1.7</span><span class="talkrow__speaker" style="display:block"><strong>Silas Alberti</strong> · SVP of Research, Cognition</span><span class="talkrow__summary">Across four increasingly ambitious training runs — Kevin-32B, SWE-grep, SWE-1.6, SWE-1.7 — Cognition found that progress on coding agents comes not from clever new ideas but from executing simple things at scale: multi-turn RL, parallel tool calls, asynchronous RL, and beating entropy collapse.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="dhruv-batra--computer-use-models-will-agentify-the-web-not-apis" type="button" style="--reveal-delay: 90ms;"><span class="talkrow__time">00:28</span><span class="talkrow__main"><span class="talkrow__title">Computer-Use Models Will Agentify the Web, Not APIs</span><span class="talkrow__speaker" style="display:block"><strong>Dhruv Batra</strong> · Chief Scientist / Co-founder, Yutori</span><span class="talkrow__summary">The popular narrative gets two steps right — agents will drive most action on the web, and the web will be agentified — but the third step is wrong: it won't happen through APIs, because the long tail of the web was built for human eyeballs, and only vision-based computer-use models can reach it.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="shamir-abdul-aziz--zero-ops-agents-operate-humans-govern" type="button" style="--reveal-delay: 135ms;"><span class="talkrow__time">00:40</span><span class="talkrow__main"><span class="talkrow__title">Zero Ops - Agents Operate, Humans Govern</span><span class="talkrow__speaker" style="display:block"><strong>Shamir Abdul Aziz</strong> · Principal Product Manager, Microsoft</span><span class="talkrow__summary">Zero Ops isn't about removing humans from operations — it's about removing operations from humans. Models are swappable; your context, governance, and tools are not. And only auditable, roll-back-able, evidence-backed governance gets enterprises to deploy agents at scale.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="krishnakumar-sharma--agentic-coding-the-boring-way" type="button" style="--reveal-delay: 180ms;"><span class="talkrow__time">00:46</span><span class="talkrow__main"><span class="talkrow__title">Agentic Coding, the Boring Way</span><span class="talkrow__speaker" style="display:block"><strong>Krishnakumar Sharma</strong> · CEO, Omokai</span><span class="talkrow__summary">Piling on more agents, more loops, and more tokens just multiplies errors and invoices. What actually works in legacy enterprise environments is boring: produce a research artifact, then a well-defined plan, then let AI deliver — with human sign-off, cross-vendor model diversity, and no more than about four clearly scoped agents.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="workshop--market-models-quantitative-decision-agents" type="button" style="--reveal-delay: 225ms;"><span class="talkrow__time">00:54</span><span class="talkrow__main"><span class="talkrow__title">Market Models: The Missing Foundation for Quantitative Decision Agents / Architecting Quantitative Decision Agents</span><span class="talkrow__speaker" style="display:block"><strong>Uri Yerushalmi; Hadar Sharvit</strong> · Uri Yerushalmi — Chief AI Officer, Fetcherr;Hadar Sharvit — Director of Deep Learning, Fetcherr</span><span class="talkrow__summary">A decision system's architecture has to mirror the structure of the environment it decides in — so Fetcherr replaces the LLM's arithmetic with a market model trained directly on market dynamics, leaving the LLM to orchestrate. In their head-to-head, given identical data, the tool-equipped agent recommended a price *cut* (est. +6% revenue) while the vanilla agent recommended a price *raise* (est. −8%).</span></span><span class="badge badge--workshop">Workshop</span></button></section><section class="session-group"><div class="session-head"><span class="session-head__half">PM</span><span class="session-head__label">Session 3: Agentic AI in Finance &amp; Healthcare</span></div><button class="card talkrow reveal is-in" data-item="" data-slug="krishnaram-kenthapadi--trustworthy-multi-agent-ai-systems-for-healthcare" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">01:54</span><span class="talkrow__main"><span class="talkrow__title">Trustworthy Multi-Agent AI Systems for Healthcare: Challenges &amp; Lessons Learned</span><span class="talkrow__speaker" style="display:block"><strong>Krishnaram Kenthapadi</strong> · Chief Scientist, Oracle Health</span><span class="talkrow__summary">The value of a healthcare agent lies not in model strength but in giving clinicians their time back from EHR paperwork — and shipping one hinges on domain knowledge encoded as a semantic knowledge graph, two-sided guardrails, and an evaluation methodology that assumes offline metrics will not survive contact with production.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="venkat-bhat--agentic-ai-applications-for-mental-health" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">02:08</span><span class="talkrow__main"><span class="talkrow__title">Agentic AI Applications for Mental Health: From Chatbots to Clinical Orchestration</span><span class="talkrow__speaker" style="display:block"><strong>Venkat Bhat</strong> · Associate Professor; Director, AI for Mental Health (AI-M) Program, University of Toronto</span><span class="talkrow__summary">A psychiatrist and clinical trialist's position — a multi-agent system that performs well in simulation is only step one; what mental health actually lacks is randomized controlled trials, and worldwide there is still only about one (going on two) RCT of a generative-AI-based tool.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="shaghayegh-gharghabi--one-environment-whole-lifecycle-agentic-post-training-for-nemotron-in-finance" type="button" style="--reveal-delay: 0ms;"><span class="talkrow__time">02:23</span><span class="talkrow__main"><span class="talkrow__title">One Environment, Whole Lifecycle: Agentic Post-Training for Nemotron in Finance</span><span class="talkrow__speaker" style="display:block"><strong>Shaghayegh Gharghabi</strong> · Deep Learning Scientist, NVIDIA</span><span class="talkrow__summary">NVIDIA's finance reasoning team is open-sourcing not a checkpoint but the whole post-training pipeline — and by running synthetic data generation, SFT, and RL inside one shared environment with the same tools and the same format, they design the train/inference mismatch problem out of existence.</span></span><span class="badge badge--talk">Talk</span></button></section><section class="session-group"><div class="session-head"><span class="session-head__half">PM</span><span class="session-head__label">Session 4: Secure Agentic AI</span></div><button class="card talkrow reveal is-in" data-item="" data-slug="jon-rav-shende--observability-is-not-governance" type="button" style="--reveal-delay: 45ms;"><span class="talkrow__time">02:30</span><span class="talkrow__main"><span class="talkrow__title">Observability Is Not Governance: Building a Runtime Trust Plane for Agentic AI</span><span class="talkrow__speaker" style="display:block"><strong>Jon-Rav Shende</strong> · Chief Technology Officer, Thales Group</span><span class="talkrow__summary">Being able to see what an agent is doing is not the same as being able to do something about it; real governance watches the control path rather than the agent, and adjudicates every execution commit in real time against declared-vs-observed variance across identity, policy, risk, and evidence.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="bo-li--securing-ai-agents" type="button" style="--reveal-delay: 90ms;"><span class="talkrow__time">02:47</span><span class="talkrow__main"><span class="talkrow__title">Securing AI Agents: From Risk Assessment and Runtime Guardrails to Self-Improvement and Certification</span><span class="talkrow__speaker" style="display:block"><strong>Bo Li</strong> · Co-Founder and CEO, Virtue AI; UIUC</span><span class="talkrow__summary">AI security is the last mile for every AI application, and that mile decomposes into three buckets — stress-test with red teaming to find the weaknesses, protect along two tracks (fixing the model itself, and a plug-and-play firewall for AI), and finally make the guardrail carry provable guarantees.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="milad-nasr--end-to-end-security-research-with-a-language-model" type="button" style="--reveal-delay: 135ms;"><span class="talkrow__time">03:01</span><span class="talkrow__main"><span class="talkrow__title">End-to-End Security Research with a Language Model</span><span class="talkrow__speaker" style="display:block"><strong>Milad Nasr</strong> · Research Scientist, Anthropic</span><span class="talkrow__summary">Two years ago a room of frontier-lab researchers predicted end-to-end AI research was more than a decade away; Nasr used a 7-round AES cryptanalysis paper published that same week to argue the prediction was most wrong about *research*, not coding — and that the bottleneck has moved from generating ideas to verifying results.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="itsik-mantin--when-good-agents-go-rogue" type="button" style="--reveal-delay: 180ms;"><span class="talkrow__time">03:14</span><span class="talkrow__main"><span class="talkrow__title">When Good Agents Go Rogue</span><span class="talkrow__speaker" style="display:block"><strong>Itsik Mantin</strong> · Head of AI Security Research, Intuit</span><span class="talkrow__summary">Agents don't go bad on their own — they get hijacked by content they ingested; every tool you connect is a key you hand over, so the only workable defense is layered: least privilege, vetted connectors, sandboxes, and a human in the loop.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="john-a-mcdermid--safety-and-security-of-agentic-ai" type="button" style="--reveal-delay: 225ms;"><span class="talkrow__time">03:25</span><span class="talkrow__main"><span class="talkrow__title">Safety and Security of Agentic AI</span><span class="talkrow__speaker" style="display:block"><strong>John A McDermid</strong> · Director, Centre for Assuring Autonomy, Institute for Safe Autonomy, University of York</span><span class="talkrow__summary">Safety and security have traditionally been assessed in isolation, but agentic AI in cyber-physical systems expands the attack surface into training pipelines *and* the physical world; modeling both in a structural causal world model reveals that two attacks that are individually survivable become lethal when their time ordering changes.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="mohamed-nabeel--ghost-in-the-web-store" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">03:38</span><span class="talkrow__main"><span class="talkrow__title">Ghost in the Web Store: Preempting LLM-Hallucinated Browser Extension Supply Chain Attacks</span><span class="talkrow__speaker" style="display:block"><strong>Mohamed Nabeel</strong> · Senior Principal Researcher, Palo Alto Networks</span><span class="talkrow__summary">LLMs confidently recommend browser extensions that never existed, were deleted, or sit unclaimed — and an attacker who registers those hallucinated identifiers gets in without breaking anything. The research hunts those ghosts before attackers bring them back to life.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="workshop--future-of-agent-evaluation" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">03:45</span><span class="talkrow__main"><span class="talkrow__title">Future of Agent Evaluation</span><span class="talkrow__speaker" style="display:block"><strong>Berkeley RDI(逐字稿中三位講者:AgentBeats / Agents' Last Exam 主講者、Jun、Joy;議程未列講者名單)</strong> · UC Berkeley RDI 及合作機構 / UC Berkeley RDI and collaborators</span><span class="talkrow__summary">One standard and three benchmarks. AgentBeats turns benchmarks into agents to kill the N×N integration tax; Agents' Last Exam asks whether agents can do economically valuable real work; the frontier cyber suite asks how capable agents are across the vulnerability lifecycle; and verifiable code generation asks whether an agent can prove its own code correct.</span></span><span class="badge badge--workshop">Workshop</span></button></section>
