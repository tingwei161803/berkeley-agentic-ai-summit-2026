<header class="pagehead reveal is-in" style="--reveal-delay: 0ms;"><p class="kicker">Saturday, August 1</p><h1>Atlas Stage</h1><div class="pagehead__meta"><span>17 talks · 3 sessions</span><a href="https://www.youtube.com/watch?v=WeriQic-QW0" target="_blank" rel="noopener"><span class="material-symbols-rounded" aria-hidden="true">play_circle</span>Morning stream</a><a href="https://www.youtube.com/watch?v=psPzCQbjCCo" target="_blank" rel="noopener"><span class="material-symbols-rounded" aria-hidden="true">play_circle</span>Afternoon stream</a></div></header><div class="controls"><div class="searchwrap"><span class="material-symbols-rounded" aria-hidden="true">search</span><input id="search" type="search" placeholder="Search talks, speakers, topics…" value="" aria-label="Search talks, speakers, topics…"></div><div class="chiprow"><button class="chip active" data-filter="all" aria-pressed="true">All</button><button class="chip" data-filter="keynote" aria-pressed="false">Keynote</button><button class="chip" data-filter="talk" aria-pressed="false">Talk</button><button class="chip" data-filter="workshop" aria-pressed="false">Workshop</button><span class="result-count">17 / 17 talks</span></div></div><section class="session-group"><div class="session-head"><span class="session-head__half">AM</span><span class="session-head__label">Session 1: Foundational Capabilities</span></div><button class="card talkrow reveal is-in" data-item="" data-slug="jianfeng-gao--agentic-modeling-via-internalizing-agent-harnesses" type="button" style="--reveal-delay: 45ms;"><span class="talkrow__time">00:01</span><span class="talkrow__main"><span class="talkrow__title">Agentic Modeling via Internalizing Agent Harnesses</span><span class="talkrow__speaker" style="display:block"><strong>Jianfeng Gao</strong> · Technical Fellow &amp; Corporate Vice President, Microsoft Research</span><span class="talkrow__summary">A language model is a talker; the agent harness is what turns it into a doer — and the next step is distilling the harness's capabilities back into the model itself, because harnesses are to agentic modeling what internet data was to pre-training.</span></span><span class="badge badge--keynote">Keynote</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="sanja-fidler--world-models-for-physical-ai-simulation" type="button" style="--reveal-delay: 90ms;"><span class="talkrow__time">00:17</span><span class="talkrow__main"><span class="talkrow__title">World Models for Physical AI Simulation</span><span class="talkrow__speaker" style="display:block"><strong>Sanja Fidler</strong> · Associate Professor, University of Toronto; Former VP of AI Research, Nvidia</span><span class="talkrow__summary">The bottleneck in robotics isn't the policy, it's simulation — real robots run at physical time, while generative world models can *imagine* unlimited long-tail scenarios on GPUs faster than real time; in one year this went from "5 seconds of video per 5 minutes of GPU time" to real-time interactive, and now runs on a consumer GPU.</span></span><span class="badge badge--keynote">Keynote</span></button><button class="card talkrow reveal" data-item="" data-slug="giambattista-parascandolo--when-language-models-learned-to-reason" type="button" style="--reveal-delay: 135ms;"><span class="talkrow__time">00:32</span><span class="talkrow__main"><span class="talkrow__title">When Language Models Learned to Reason</span><span class="talkrow__speaker" style="display:block"><strong>Giambattista Parascandolo</strong> · Research Fellow, OpenAI</span><span class="talkrow__summary">He dug out the actual four-to-five-year-old internal slides from OpenAI's earliest discussions of reasoning — back when giving a model more time produced the identical answer — and showed the humble evidence that convinced the team to scale it up: some ugly slides about counting bags of potatoes.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="aditya-grover--redefining-the-token-efficiency-frontier-with-diffusion-llms" type="button" style="--reveal-delay: 180ms;"><span class="talkrow__time">00:41</span><span class="talkrow__main"><span class="talkrow__title">Redefining the Token Efficiency Frontier with Diffusion LLMs</span><span class="talkrow__speaker" style="display:block"><strong>Aditya Grover</strong> · Co-Founder/CTO, Inception Labs</span><span class="talkrow__summary">Every major leap in AI came from parallelizing something — GPUs parallelized matrix multiplication, Transformers parallelized training, and diffusion parallelizes *generation* itself; now that intelligence is abundant, the new currency is intelligence per watt.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="workshop--turning-chatbots-into-agents" type="button" style="--reveal-delay: 225ms;"><span class="talkrow__time">01:08</span><span class="talkrow__main"><span class="talkrow__title">Turning Chatbots into Agents: What Modern RL Looks Like</span><span class="talkrow__speaker" style="display:block"><strong>Lovre Pesut; Muhammad Hashmi</strong> · AI Engineer, Daytona; DevRel, Daytona</span><span class="talkrow__summary">Same harness, same tools — GPT-2 falls apart where Kimi K3 fixes your bug, and the difference is reinforcement learning; but modern RL's real bottleneck isn't the algorithm, it's who supplies the tens of millions of disposable sandboxes, and the fact that *environments* have become the new training data.</span></span><span class="badge badge--workshop">Workshop</span></button></section><section class="session-group"><div class="session-head"><span class="session-head__half">PM</span><span class="session-head__label">Session 2: Robotics &amp; World Models</span></div><button class="card talkrow reveal" data-item="" data-slug="peter-stone--outplaying-elite-table-tennis-players-with-an-autonomous-robot" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">00:14</span><span class="talkrow__main"><span class="talkrow__title">Outplaying Elite Table Tennis Players with an Autonomous Robot</span><span class="talkrow__speaker" style="display:block"><strong>Peter Stone</strong> · Chief Scientist, Sony AI; Professor, UT Austin</span><span class="talkrow__summary">Sony AI's Ace is the first autonomous robot to beat professionally ranked players head-to-head under official rules — proof that AI agents can now reach expert-level performance at fast, real-time decision-making in physical space, and it took perception, reinforcement learning, and custom hardware pushed to their limits together, not any single breakthrough.</span></span><span class="badge badge--keynote">Keynote</span></button><button class="card talkrow reveal" data-item="" data-slug="vincent-vanhoucke--trustworthy-agents-in-the-real-world" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">00:29</span><span class="talkrow__main"><span class="talkrow__title">Trustworthy Agents in the Real World: Physical Autonomy Lessons for the Agentic AI Era</span><span class="talkrow__speaker" style="display:block"><strong>Vincent Vanhoucke</strong> · Distinguished Engineer, Waymo</span><span class="talkrow__summary">Waymo *is* an agentic AI company — its agents just happen to be big hunks of metal on four wheels — and the potholes robotics hit over twenty years (each "nine" of reliability costs a system redesign, Level 3 is the worst place to be, step-wise optimization always drifts) are now hitting agentic AI verbatim; the shared answer is that you need a world model first.</span></span><span class="badge badge--keynote">Keynote</span></button><button class="card talkrow reveal" data-item="" data-slug="trevor-darrell--real-world-reasoning-agents" type="button" style="--reveal-delay: 0ms;"><span class="talkrow__time">00:44</span><span class="talkrow__main"><span class="talkrow__title">Real-World Reasoning Agents</span><span class="talkrow__speaker" style="display:block"><strong>Trevor Darrell</strong> · Professor, UC Berkeley</span><span class="talkrow__summary">For agents to work in the physical world they need to *see* (catch the one small difference between two images that matters), *feel* (react to touch in real time rather than plan from vision alone), and *reason about motion abstractly* (predict SE(3) pose trajectories instead of every pixel).</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="manmohan-chandraker--making-autonomy-autonomous" type="button" style="--reveal-delay: 45ms;"><span class="talkrow__time">00:55</span><span class="talkrow__main"><span class="talkrow__title">Making Autonomy Autonomous: Toward Mental Models for Discovery and Intuition</span><span class="talkrow__speaker" style="display:block"><strong>Manmohan Chandraker</strong> · Professor, University of California, San Diego</span><span class="talkrow__summary">Physical AI's edge cases never run out, so let a team of agents run the discover-experiment-validate-write loop themselves; what keeps that from being hallucination is that every claim traces back to a real GPU run and a real line of code — and the human's role shifts from executor to the source of *tacit expertise* and *intent*.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="bolei-zhou--scaling-sidewalk-autonomy-with-world-models" type="button" style="--reveal-delay: 90ms;"><span class="talkrow__time">01:04</span><span class="talkrow__main"><span class="talkrow__title">Scaling Sidewalk Autonomy with World Models</span><span class="talkrow__speaker" style="display:block"><strong>Bolei Zhou</strong> · Associate Professor, UCLA; Chief AI Scientist, Coco Robotics</span><span class="talkrow__summary">The bottleneck in sidewalk autonomy isn't a shortage of models — it's having no fair way to evaluate them before deployment; the fix is to treat real-world video as source code, reconstruct it into interactive simulation, and grow many "digital cousins" from a single clip for training and evaluation.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="workshop--open-source-agent-investigations" type="button" style="--reveal-delay: 135ms;"><span class="talkrow__time">01:14</span><span class="talkrow__main"><span class="talkrow__title">Open-Source Agent Investigations: Security Arena, Distilled Traces, and Auto-Optimization</span><span class="talkrow__speaker" style="display:block"><strong>Devina Jain; Zach Mueller; Chuan Li</strong> · Research Engineer, Lambda; Head of Developer Relations, Lambda; Chief Science Officer, Lambda</span><span class="talkrow__summary">Lambda ran three open-source experiments against the same question — *what do we actually know about agents?* The attack/defense arena found that winning prompt injections are transferable rhetorical shapes, not domain-specific exploits; distilling 300M tokens of traces found that the harness, not the model, often decides performance; and giving Claude Code an experiment tracker found that what matters isn't how smart it is but whether it writes things down.</span></span><span class="badge badge--workshop">Workshop</span></button><button class="card talkrow reveal" data-item="" data-slug="workshop--building-agentic-apps-with-replit-agent" type="button" style="--reveal-delay: 180ms;"><span class="talkrow__time">02:14</span><span class="talkrow__main"><span class="talkrow__title">Building Agentic Apps End-to-End with Replit Agent</span><span class="talkrow__speaker" style="display:block"><strong>Brandon Middleton</strong> · Head of Education, Replit</span><span class="talkrow__summary">A workshop billed as "build apps with Replit Agent" spends three quarters of its time on education — because once information *and* intelligence are abundant, a university built on trading time served for learning, credentials for capability, and sorting for teaching stops working; and the point of vibe coding isn't saving keystrokes, it's letting a 15-year-old, a musician with no CS background, or Shaquille O'Neal turn an idea into something that runs.</span></span><span class="badge badge--workshop">Workshop</span></button></section><section class="session-group"><div class="session-head"><span class="session-head__half">PM</span><span class="session-head__label">Session 3: Frameworks &amp; Dev Platforms</span></div><button class="card talkrow reveal" data-item="" data-slug="philip-rathle--graphs-are-the-knowledge-layer-for-agentic-ai" type="button" style="--reveal-delay: 225ms;"><span class="talkrow__time">03:14</span><span class="talkrow__main"><span class="talkrow__title">Graphs Are the Knowledge Layer for Agentic AI</span><span class="talkrow__speaker" style="display:block"><strong>Philip Rathle</strong> · CTO, Neo4j</span><span class="talkrow__summary">Knowledge, context, semantics, memory, and ontology are facets of one thing — an enterprise knowledge layer — and graphs are its natural implementation, because real-world data already arrives as networks, hierarchies, and paths.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="josh-albrecht--building-punk-software-an-open-agent-stack" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">03:29</span><span class="talkrow__main"><span class="talkrow__title">Building Punk Software: An Open Agent Stack</span><span class="talkrow__speaker" style="display:block"><strong>Josh Albrecht</strong> · Co-founder and CTO, Imbue</span><span class="talkrow__summary">AI may not pose an existential risk to the species, but it does to *you* and your livelihood, because the frontier stack is controlled by a handful of companies — the answer is to open the whole stack and build it yourself.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="woosuk-kwon--vllm-building-open-and-efficient-inference-for-agents" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">03:44</span><span class="talkrow__main"><span class="talkrow__title">vLLM: Building Open and Efficient Inference for Agents</span><span class="talkrow__speaker" style="display:block"><strong>Woosuk Kwon</strong> · Co-Founder &amp; CTO, Inferact</span><span class="talkrow__summary">Agents barely changed the inference API but changed everything underneath it — so vLLM is rebuilding along three axes: workload-aware model parallelism, dynamic hierarchical KV cache, and enough hardware backends to turn any compute on earth into tokens.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="banghua-zhu--building-frontier-inference-and-training-infra-for-agent" type="button" style="--reveal-delay: 0ms;"><span class="talkrow__time">04:01</span><span class="talkrow__main"><span class="talkrow__title">Building Frontier Inference and Training Infra for Agent: A Case Study of SGLang and Miles</span><span class="talkrow__speaker" style="display:block"><strong>Banghua Zhu</strong> · Co-Founder, RadixArk</span><span class="talkrow__summary">2026 is the year of agentic infrastructure — inference is squeezed by cache reuse, trillion-parameter models, and million-token context, while RL training is squeezed by environment diversity and train–inference mismatch; RadixArk answers each with SGLang and Miles.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="ranjan-sinha--speaking-the-same-language-nlip-for-agent-interoperability" type="button" style="--reveal-delay: 45ms;"><span class="talkrow__time">04:14</span><span class="talkrow__main"><span class="talkrow__title">Speaking the Same Language: NLIP for Agent Interoperability</span><span class="talkrow__speaker" style="display:block"><strong>Ranjan Sinha</strong> · IBM Fellow, CTO &amp; VP for watsonx, Enterprise AI, IBM</span><span class="talkrow__summary">Traditional protocols demand that both endpoints and the wire speak the same language and break the moment a schema changes; NLIP drops that assumption — if there's intelligence at both endpoints to translate, agents can keep their own languages, and NLIP moves intent across in just five fields.</span></span><span class="badge badge--talk">Talk</span></button></section>
