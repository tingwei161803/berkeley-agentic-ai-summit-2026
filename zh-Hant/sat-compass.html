<header class="pagehead reveal is-in" style="--reveal-delay: 0ms;"><p class="kicker">8 月 1 日(六)</p><h1>Compass Stage</h1><div class="pagehead__meta"><span>19 場 · 3 個場次</span><a href="https://www.youtube.com/watch?v=IBpR4uYftLY" target="_blank" rel="noopener"><span class="material-symbols-rounded" aria-hidden="true">play_circle</span>上午場直播</a><a href="https://www.youtube.com/watch?v=AO0RXP-fVZQ" target="_blank" rel="noopener"><span class="material-symbols-rounded" aria-hidden="true">play_circle</span>下午場直播</a></div></header><div class="controls"><div class="searchwrap"><span class="material-symbols-rounded" aria-hidden="true">search</span><input id="search" type="search" placeholder="搜尋演講、講者、主題…" value="" aria-label="搜尋演講、講者、主題…"></div><div class="chiprow"><button class="chip active" data-filter="all" aria-pressed="true">全部</button><button class="chip" data-filter="keynote" aria-pressed="false">主題演講</button><button class="chip" data-filter="talk" aria-pressed="false">演講</button><button class="chip" data-filter="workshop" aria-pressed="false">工作坊</button><span class="result-count">19 / 19 場</span></div></div><section class="session-group"><div class="session-head"><span class="session-head__half">上午</span><span class="session-head__label">Session 1: AI Systems</span></div><button class="card talkrow reveal is-in" data-item="" data-slug="ion-stoica--the-limits-of-ai-coding-agents" type="button" style="--reveal-delay: 45ms;"><span class="talkrow__time">00:00</span><span class="talkrow__main"><span class="talkrow__title">AI 編碼 Agent 的極限:Agentic 軟體工程的兩個根本落差</span><span class="talkrow__speaker" style="display:block"><strong>Ion Stoica</strong> · Co-Founder, Databricks and Anyscale; Professor, UC Berkeley</span><span class="talkrow__summary">AI coding agent 之所以還沒真正顛覆軟體與系統開發,不是模型不夠強,而是卡在兩個無法被關閉、只能收窄的根本落差——requirement gap(使用者真實意圖 ⊃ 寫下來的需求)與 model gap(真實部署環境 ⊃ 開發時的模型);而 agent 因為脈絡不對稱、速度與規模,反而把這兩個落差放大成 reward hacking。</span></span><span class="badge badge--keynote">主題演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="nick-harris--photonics-is-the-future-of-computing" type="button" style="--reveal-delay: 90ms;"><span class="talkrow__time">00:24</span><span class="talkrow__main"><span class="talkrow__title">光子學是運算的未來</span><span class="talkrow__speaker" style="display:block"><strong>Nick Harris</strong> · Founder/CEO, Lightmatter</span><span class="talkrow__summary">AI 的成長曲線正在撞上美國電網的成長曲線,而真正的瓶頸不是算力而是 interconnect;Lightmatter 用光把上千顆 GPU 連成「一顆大腦」,以逼近零延遲、無限頻寬的極限來換取 3 倍訓練速度與 11 倍 decode 互動性。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="gosia-steinder--beyond-harnesses" type="button" style="--reveal-delay: 135ms;"><span class="talkrow__time">00:33</span><span class="talkrow__main"><span class="talkrow__title">超越 Harness:面向 Agent 可靠性、安全性與效率的平台解法</span><span class="talkrow__speaker" style="display:block"><strong>Gosia Steinder</strong> · IBM Fellow, IBM Research</span><span class="talkrow__summary">今天 agent 的可靠性、安全與效率問題全被塞進應用層的 harness 裡各自造輪子,但歷史(Unix/POSIX、容器/Kubernetes)顯示這一定會收斂成新的作業系統層;IBM Research 正在用一層「攔截層」把控制功能從 agent 業務邏輯中抽離出來,建立這個 agent 時代的 OS。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="tim-hockin--is-kubernetes-good-for-agents" type="button" style="--reveal-delay: 180ms;"><span class="talkrow__time">00:44</span><span class="talkrow__main"><span class="talkrow__title">Kubernetes 適合跑 Agent 嗎?為 Agent 形狀的問題找基礎設施解法</span><span class="talkrow__speaker" style="display:block"><strong>Tim Hockin</strong> · Distinguished Engineer, Google</span><span class="talkrow__summary">Agent 是 bursty、不可信、單租戶、又對延遲敏感的工作負載,恰好違反 Kubernetes「長時間執行、可水平擴展、可攤平開銷」的設計前提;Google 的開源專案 Agent Substrate 不重造 Kubernetes,而是在其上加一層積極 suspend/resume 的 actor 執行層,把「幾秒到幾十分鐘的閒置」壓成「幾百毫秒的喚醒」。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="workshop--why-your-ai-agent-needs-a-wallet" type="button" style="--reveal-delay: 225ms;"><span class="talkrow__time">01:02</span><span class="talkrow__main"><span class="talkrow__title">為什麼你的 AI Agent 需要一個錢包:用 USDC 與 Nanopayments 在 Arc 上做 agentic commerce</span><span class="talkrow__speaker" style="display:block"><strong>Harshal Bhangale</strong> · Staff Software Engineer, Circle</span><span class="talkrow__summary">今天 agent 卡住的地方通常不是模型能力,而是付款——碰到 paywall 或註冊流程就把控制權交還給人;給 agent 一個有預算上限的錢包,加上 x402 + USDC 的按次微付款,它就能自己買到需要的資源。</span></span><span class="badge badge--workshop">工作坊</span></button></section><section class="session-group"><div class="session-head"><span class="session-head__half">下午</span><span class="session-head__label">Session 2: Frameworks &amp; Dev Platforms</span></div><button class="card talkrow reveal is-in" data-item="" data-slug="wenbo-guo--opensage-next-generation-of-agentic-ai" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">00:03</span><span class="talkrow__main"><span class="talkrow__title">OpenSage:下一代 Agentic AI</span><span class="talkrow__speaker" style="display:block"><strong>Wenbo Guo</strong> · Assistant Professor, UCSB</span><span class="talkrow__summary">今天的 agent 框架都要人先把 topology、工具集、記憶結構寫死,這正是十年前深度學習時代被淘汰的「feature engineering」;OpenSage 只給最小 scaffold,讓 agent 自己長出 sub-agent、自己寫工具與記憶——這是他們口中的 agent 2.0。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="ramesh-raskar--the-agentic-web-and-the-bazaar-era-of-ai" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">00:13</span><span class="talkrow__main"><span class="talkrow__title">Agentic Web 與 AI 的市集時代</span><span class="talkrow__speaker" style="display:block"><strong>Ramesh Raskar</strong> · Professor, MIT</span><span class="talkrow__summary">AI 正從少數大廠量產、我們被動消費的「工廠時代」轉向邊緣模型遍地開花的「市集時代」;當網路上有數十億個 agent 時,真正的問題不是誰的模型最強,而是誰來蓋 agent 的基礎設施——因為蓋的人就會擁有它。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="shiva-kasiviswanthan--toward-adaptive-agent-frameworks" type="button" style="--reveal-delay: 0ms;"><span class="talkrow__time">00:23</span><span class="talkrow__main"><span class="talkrow__title">邁向自適應的 Agent 框架</span><span class="talkrow__speaker" style="display:block"><strong>Shiva Kasiviswanthan</strong> · Principal Applied Scientist, Amazon Web Services</span><span class="talkrow__summary">今天的 agent 已經很會 plan 與用工具,但它們的執行策略是寫死的;要進到 mission-critical 場景,agent 得學會在預算約束下決定下一步(constrained MDP)、學會平行探索多條推理路徑,並能持續適應新任務而不遺忘舊的。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="tanya-roosta--information-retrieval-in-the-age-of-agentic-ai" type="button" style="--reveal-delay: 45ms;"><span class="talkrow__time">00:29</span><span class="talkrow__main"><span class="talkrow__title">Agentic AI 時代的資訊檢索</span><span class="talkrow__speaker" style="display:block"><strong>Tanya Roosta</strong> · Director of AI, AMD; Berkeley alumna</span><span class="talkrow__summary">檢索的工作單位已經從「查一次」變成「和世界持續對話」——但我們的評估方式還停在拿 BLEU / ROUGE 打最終答案的分數;要跟上,就得改成評估整條 trace:每一跳的正確性、是否足以回答問題,以及 token 與延遲的成本。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="denis-akhiyarov--are-small-llms-ready-for-coding-agents" type="button" style="--reveal-delay: 90ms;"><span class="talkrow__time">00:37</span><span class="talkrow__main"><span class="talkrow__title">小模型準備好當 Coding Agent 了嗎?</span><span class="talkrow__speaker" style="display:block"><strong>Denis Akhiyarov</strong> · Senior Staff AI Scientist, ServiceNow</span><span class="talkrow__summary">把 harness 縮到一個檔案、把 context 壓到最小、每次只做一個小動作並立刻驗證,本機小模型確實能完成大部分真實 coding 任務——卡住的地方不是寫程式,而是自我驗證那一段閉環。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="nilou-salehi--agent-learning-requires-compressing-information" type="button" style="--reveal-delay: 135ms;"><span class="talkrow__time">00:43</span><span class="talkrow__main"><span class="talkrow__title">Agent 的學習,是把資訊壓縮成一個可執行的推理結構</span><span class="talkrow__speaker" style="display:block"><strong>Nilou Salehi</strong> · Associate Professor, UC Berkeley</span><span class="talkrow__summary">模型在做的、harness 在做的,本質是同一件事——把大量資訊壓縮成可執行的形式;而對那些必須高度一致、可解釋、長期跑的企業流程,最適合的可執行形式是一張由 agent 自己搭建的 reasoning graph。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="johann-schleier-smith--systems-foundations-for-agentic-ai" type="button" style="--reveal-delay: 180ms;"><span class="talkrow__time">00:49</span><span class="talkrow__main"><span class="talkrow__title">Agentic AI 的系統基礎</span><span class="talkrow__speaker" style="display:block"><strong>Johann Schleier-Smith</strong> · Senior Staff Engineer, Temporal</span><span class="talkrow__summary">蓋 agent 時真正吃掉時間的不是核心功能,而是 retry、queue、狀態管理這些橫切關注點;durable execution 的價值就是把系統邏輯和商業邏輯切開,讓你用普通語言寫出 crash-proof 的 agent——而且 agency 不是愈多愈好,好的抽象要讓你能沿著 agency 光譜自由來回。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="workshop--build-ai-agents-that-survive-failure" type="button" style="--reveal-delay: 225ms;"><span class="talkrow__time">00:59</span><span class="talkrow__main"><span class="talkrow__title">打造能從失敗中活下來的 AI Agent</span><span class="talkrow__speaker" style="display:block"><strong>Nikolay Advolodkin</strong> · Senior Staff Developer Advocate, Temporal</span><span class="talkrow__summary">把 agent 的商業流程放進 workflow、把所有會失敗的非確定性動作(LLM 呼叫、API、DB 查詢)包成 activity,Temporal 就會替你記住歷史、無限重試、並在故障排除後像什麼都沒發生過一樣接著跑下去——現場直接拔掉 weather API 給大家看。</span></span><span class="badge badge--workshop">工作坊</span></button></section><section class="session-group"><div class="session-head"><span class="session-head__half">下午</span><span class="session-head__label">Session 3: Foundational Capabilities</span></div><button class="card talkrow reveal is-in" data-item="" data-slug="doga-kerestecioglu--mindful-agents-human-inspired-memories-for-long-horizon-tasks" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">02:00</span><span class="talkrow__main"><span class="talkrow__title">Mindful Agents:給長程任務的人類啟發式記憶</span><span class="talkrow__speaker" style="display:block"><strong>Doga Kerestecioglu</strong> · Principal Applied Scientist, Microsoft Corporation</span><span class="talkrow__summary">Agent 沒有人類的儲存限制,反而喪失了「蒸餾記憶」的能力;Microsoft Fabric AI 團隊借用人腦的記憶生命週期(攝取 → 固化 → 遺忘 → 檢索 → 再固化)為長時間執行的串流資料 agent 建記憶,並主張這類系統必須用「保留 / 檢索 / 任務完成」三層 eval 才測得準。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="ian-fischer--an-optimization-perspective-on-recursive-self-improvement" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">02:10</span><span class="talkrow__main"><span class="talkrow__title">從最佳化視角看遞迴自我改進</span><span class="talkrow__speaker" style="display:block"><strong>Ian Fischer</strong> · Co-CEO, Poetiq</span><span class="talkrow__summary">真正的 RSI 需要「遞迴」與「自我」同時成立;把 LLM 當成系統的一個零件、而非改進的唯一目標,就能用「會自我最佳化的最佳化器」在每一步只花一次 inference(而非一次訓練)的成本下做到真正的複利式自我改進。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="yu-su--intelligence-plus-continual-learning-equals-expertise" type="button" style="--reveal-delay: 0ms;"><span class="talkrow__time">02:21</span><span class="talkrow__main"><span class="talkrow__title">智慧 + 持續學習 = 專業</span><span class="talkrow__speaker" style="display:block"><strong>Yu Su</strong> · CEO, NeoCognition; Associate Professor, OSU</span><span class="talkrow__summary">智慧(解題能力)與專業(在特定環境中累積的、情境化的可靠競爭力)是兩條正交的軸;現代社會由數以百萬計、各有其「局部物理定律」的微世界構成,靜態模型壓縮不了,所以必須靠 continual learning 在工作中長出專業——而這條軸,將是下一個 scaling 維度。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="furong-huang--reasoning-as-control-adaptive-test-time-compute-for-planning-agents" type="button" style="--reveal-delay: 45ms;"><span class="talkrow__time">02:33</span><span class="talkrow__main"><span class="talkrow__title">把推理當成控制:給規劃型 agent 的自適應 test-time compute</span><span class="talkrow__speaker" style="display:block"><strong>Furong Huang</strong> · Associate Professor, University of Maryland</span><span class="talkrow__summary">自我改進不該只被當成「模型能力」;基礎模型正在變成 runtime 的決策者,而 agentic 系統的自我改進可以發生在三個層級——thinking(token 級解碼控制)、action(真正的自我反思而非模仿更強模型)、workflow(從 workflow bank 中即時挑選拓撲)——這三層都能在不重訓模型的前提下改進。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="raja-giryes--on-the-visual-capabilities-of-multimodal-models" type="button" style="--reveal-delay: 90ms;"><span class="talkrow__time">02:45</span><span class="talkrow__main"><span class="talkrow__title">談多模態模型的視覺能力</span><span class="talkrow__speaker" style="display:block"><strong>Raja Giryes</strong> · Professor, Tel Aviv University</span><span class="talkrow__summary">多模態模型的推理幾乎都發生在 LLM 那一側、視覺端只是外掛,這解釋了它們在空間認知上的長期落後;但兩年間從「接近隨機猜」到「接近滿分」的躍進顯示——問對問題本身就會驅動進展,而進展的機制正是模型開始在內部權重裡「想像」視覺中間狀態。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="workshop--the-open-agentic-stack" type="button" style="--reveal-delay: 135ms;"><span class="talkrow__time">02:57</span><span class="talkrow__main"><span class="talkrow__title">開放的 Agentic Stack:用開源、開放標準與可組合性打造 AI 系統的未來</span><span class="talkrow__speaker" style="display:block"><strong>Matt White, Ben Burtenshaw, Daniel Han Chen, Shang Yang, Romil Bhardwaj</strong> · Matt White (Former Global CTO of AI, Linux Foundation; CTO, PyTorch Foundation); Ben Burtenshaw (Community Engineer, Hugging Face); Daniel-Han Chen (Co-Founder, Unsloth); Shang Yang (RadixArk); Romil Bhardwaj (Co-Founder and CPO, SkyPilot)</span><span class="talkrow__summary">agent 不是一個模型,而是一整個 stack——模型、harness、工具、環境、guardrail、RL 系統、評估基礎設施、算力,任何一層被垂直封閉,整個生態系就變得不可攜、缺乏競爭且更脆弱;這場 workshop 用四場子講題,分別攤開環境(OpenEnv)、模型(Unsloth)、RL(Miles)與算力(SkyPilot)這四層該怎麼保持開放。</span></span><span class="badge badge--workshop">工作坊</span></button></section>
