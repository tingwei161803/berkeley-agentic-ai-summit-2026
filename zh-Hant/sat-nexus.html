<header class="pagehead reveal is-in" style="--reveal-delay: 0ms;"><p class="kicker">8 月 1 日(六)</p><h1>Nexus Stage</h1><div class="pagehead__meta"><span>23 場 · 4 個場次</span><a href="https://www.youtube.com/watch?v=LB7IkZhEYic" target="_blank" rel="noopener"><span class="material-symbols-rounded" aria-hidden="true">play_circle</span>上午場直播</a><a href="https://www.youtube.com/watch?v=ZIRc3EpzQJs" target="_blank" rel="noopener"><span class="material-symbols-rounded" aria-hidden="true">play_circle</span>下午場直播</a></div></header><div class="controls"><div class="searchwrap"><span class="material-symbols-rounded" aria-hidden="true">search</span><input id="search" type="search" placeholder="搜尋演講、講者、主題…" value="" aria-label="搜尋演講、講者、主題…"></div><div class="chiprow"><button class="chip active" data-filter="all" aria-pressed="true">全部</button><button class="chip" data-filter="keynote" aria-pressed="false">主題演講</button><button class="chip" data-filter="talk" aria-pressed="false">演講</button><button class="chip" data-filter="workshop" aria-pressed="false">工作坊</button><span class="result-count">23 / 23 場</span></div></div><section class="session-group"><div class="session-head"><span class="session-head__half">上午</span><span class="session-head__label">Session 1: AI for Science</span></div><button class="card talkrow reveal is-in" data-item="" data-slug="markus-buehler--superintelligence-for-scientific-discovery" type="button" style="--reveal-delay: 45ms;"><span class="talkrow__time">00:06</span><span class="talkrow__main"><span class="talkrow__title">為科學發現而生的超級智慧:多智能體群集與大型推理模型</span><span class="talkrow__speaker" style="display:block"><strong>Markus J. Buehler</strong> · Professor, MIT; Founder &amp; CTO, Unreasonable Labs</span><span class="talkrow__summary">真正的科學發現不是把既有典範再往外推一格,而是「改寫我們描述世界的文法」——所以 Buehler 的 agent 系統刻意設計成會自我推翻:builder 建世界模型、breaker 去蒐證打破它,再讓去中心化的 agent swarm 跳出自然分佈,自己決定哪裡值得研究。</span></span><span class="badge badge--keynote">主題演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="james-zou--harnessing-the-collective-intelligence-of-agents-for-science" type="button" style="--reveal-delay: 90ms;"><span class="talkrow__time">00:21</span><span class="talkrow__main"><span class="talkrow__title">駕馭科學研究中的智能體集體智慧</span><span class="talkrow__speaker" style="display:block"><strong>James Zou</strong> · Professor, Stanford</span><span class="talkrow__summary">新的 scaling 軸不是把單一模型做大,而是把互相協作的科學家 agent 從十個推到數千、數百萬個——並為此重建整套「給 agent 用而不是給人用」的科學資料基礎建設。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="eric-ho--unlocking-scientific-abundance-by-learning-from-superhuman-ai" type="button" style="--reveal-delay: 135ms;"><span class="talkrow__time">00:32</span><span class="talkrow__main"><span class="talkrow__title">從超人 AI 身上學習,開啟科學的豐饒時代</span><span class="talkrow__speaker" style="display:block"><strong>Eric Ho</strong> · Co-Founder/CEO, Goodfire</span><span class="talkrow__summary">超人科學模型已經知道一些人類還不知道的事;把它們的內部計算逆向工程出來,就能把那些知識搬回人類手上——這是把 AI 能力轉成科學發現最直接的一條路。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="andrew-schoen--solving-quantum-science-problems-with-smart" type="button" style="--reveal-delay: 180ms;"><span class="talkrow__time">00:47</span><span class="talkrow__main"><span class="talkrow__title">用 SMART 解決量子科學問題:自我演化的多智能體研究樹</span><span class="talkrow__speaker" style="display:block"><strong>Andrew Schoen</strong> · Partner, NEA(本場由 UC Berkeley 的 Mingu Kang 代為報告 / presented on his behalf by Mingu Kang, UC Berkeley)</span><span class="talkrow__summary">科學發現的 agent 系統需要的不是更長的 loop,而是一棵會自己重組的研究樹——SMART 用 planner/worker/verifier 三件組構成節點、讓樹隨探索改寫自己,在中性原子量子電腦的原子搬運問題上把重排時間壓低 25–83%。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="mengdi-wang--labos-the-ai-xr-co-scientist" type="button" style="--reveal-delay: 225ms;"><span class="talkrow__time">01:03</span><span class="talkrow__main"><span class="talkrow__title">LabOS:看得見人、也與人協作的 AI-XR 共同科學家</span><span class="talkrow__speaker" style="display:block"><strong>Mengdi Wang</strong> · Professor, Princeton</span><span class="talkrow__summary">AI 擴張的真正瓶頸不是假設,是驗證——實體實驗沒有 checkpoint、沒有 log、無法回溯,所以 Mengdi Wang 的解法是讓 AI 戴上智慧眼鏡進實驗室,把每一個實體動作變成可觀測、可除錯的環境。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="rose-yu--towards-ai-co-scientists" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">01:11</span><span class="talkrow__main"><span class="talkrow__title">邁向 AI 共同科學家:用 Agentic AI 做科學發現</span><span class="talkrow__speaker" style="display:block"><strong>Rose Yu</strong> · Professor, UC San Diego; CEO/Co-Founder, GistFlow</span><span class="talkrow__summary">物理世界一次打破了 agentic 系統的三個基本假設——工具很貴、環境有守恆律、事件稀有且高度不確定;Rose Yu 的解法是把物理定律直接寫進 agent 的推理引擎,做出能自適應地在「內部推理」與「跑幾天的模擬」之間切換的科學家。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="jonathan-welch--building-ai-for-the-physical-world" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">01:20</span><span class="talkrow__main"><span class="talkrow__title">為物理世界打造 AI:替全球化學家加速發現的實戰教訓</span><span class="talkrow__speaker" style="display:block"><strong>Jonathan Welch</strong> · Head of AI, Albert Invent</span><span class="talkrow__summary">在工業化學裡,agentic co-scientist 最重要的功能不是準確率而是信任;而信任不是被複雜推理的大失敗打垮的,是被「檢索排到第 300 名以後」這種安靜的領域錯位一點一點磨掉的。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="workshop--token-efficient-openclaw" type="button" style="--reveal-delay: 0ms;"><span class="talkrow__time">01:26</span><span class="talkrow__main"><span class="talkrow__title">打造 token 高效的 OpenClaw Agentic 系統</span><span class="talkrow__speaker" style="display:block"><strong>Mahdi Ghodsi、Satya Devineni、Eda Zhou</strong> · AI Solutions Architect, AMD;Product Application Engineer, AMD;Software Development Engineer, AMD</span><span class="talkrow__summary">agentic 工作把計價單位從「每秒 token 數」推向「每個完成任務的成本」,而降低那個成本的兩把刀是分層快取(別重算上一輪算過的東西)與模型路由(別把找檔案的請求送去前沿模型)。</span></span><span class="badge badge--workshop">工作坊</span></button></section><section class="session-group"><div class="session-head"><span class="session-head__half">下午</span><span class="session-head__label">Session 2: Coding &amp; Web Agents</span></div><button class="card talkrow reveal is-in" data-item="" data-slug="silas-alberti--scaling-rl-for-coding-agents" type="button" style="--reveal-delay: 45ms;"><span class="talkrow__time">00:13</span><span class="talkrow__main"><span class="talkrow__title">為 coding agent 擴展 RL:訓練 SWE-1.7 的經驗</span><span class="talkrow__speaker" style="display:block"><strong>Silas Alberti</strong> · SVP of Research, Cognition</span><span class="talkrow__summary">Cognition 用四次規模逐步放大的 RL 訓練跑(Kevin-32B → SWE-grep → SWE-1.6 → SWE-1.7)證明,coding agent 的進步不需要花俏的新點子,而是把 multi-turn RL、parallel tool calls、asynchronous RL、對抗 entropy collapse 這些「簡單的事」在規模上確實執行到位。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="dhruv-batra--computer-use-models-will-agentify-the-web-not-apis" type="button" style="--reveal-delay: 90ms;"><span class="talkrow__time">00:28</span><span class="talkrow__main"><span class="talkrow__title">會把 web agent 化的是 computer-use 模型,不是 API</span><span class="talkrow__speaker" style="display:block"><strong>Dhruv Batra</strong> · Chief Scientist / Co-founder, Yutori</span><span class="talkrow__summary">「agent 會成為 web 上主要的行動者、web 會被 agent 化」這兩步是對的,但「靠 API 來達成」這一步是錯的——因為 web 的長尾是為人眼建造的,只有看像素、按按鈕的 computer-use 模型才進得去。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="shamir-abdul-aziz--zero-ops-agents-operate-humans-govern" type="button" style="--reveal-delay: 135ms;"><span class="talkrow__time">00:40</span><span class="talkrow__main"><span class="talkrow__title">Zero Ops:agent 執行,人類治理</span><span class="talkrow__speaker" style="display:block"><strong>Shamir Abdul Aziz</strong> · Principal Product Manager, Microsoft</span><span class="talkrow__summary">Zero Ops 不是把人從維運中移除,而是把維運從人身上移除——模型是可換的,但你的 context、治理與工具不是,而唯有可稽核、可回滾、可用證據佐證的治理,才能讓企業真的敢把 agent 放到規模上跑。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="krishnakumar-sharma--agentic-coding-the-boring-way" type="button" style="--reveal-delay: 180ms;"><span class="talkrow__time">00:46</span><span class="talkrow__main"><span class="talkrow__title">無聊的那條路:agentic coding 的紀律做法</span><span class="talkrow__speaker" style="display:block"><strong>Krishnakumar Sharma</strong> · CEO, Omokai</span><span class="talkrow__summary">無節制地堆 agent、堆 loop、堆 token,只會讓錯誤與帳單一起變多;在 legacy 企業環境裡真正可靠的做法很無聊——先做研究產出 artifact、再產出明確計畫、才交給 AI 交付,搭配人類簽核、跨家族多模型交叉驗證,以及不超過四個定義清楚的 agent。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="workshop--market-models-quantitative-decision-agents" type="button" style="--reveal-delay: 225ms;"><span class="talkrow__time">00:54</span><span class="talkrow__main"><span class="talkrow__title">Market Model:量化決策 agent 缺的那塊地基 / 量化決策 agent 的架構實作</span><span class="talkrow__speaker" style="display:block"><strong>Uri Yerushalmi; Hadar Sharvit</strong> · Uri Yerushalmi — Chief AI Officer, Fetcherr;Hadar Sharvit — Director of Deep Learning, Fetcherr</span><span class="talkrow__summary">語言模型不該負責算術——決策系統的架構必須反映決策所在環境的結構,所以 Fetcherr 用直接在市場動態上訓練的 market model 取代 LLM 承擔預測與最佳化,LLM 只負責編排;實測中同一題目、同一份資料,配備 market model 的 agent 建議降價(估計 +6% 營收),而純 LLM agent 建議漲價(估計 −8%)。</span></span><span class="badge badge--workshop">工作坊</span></button></section><section class="session-group"><div class="session-head"><span class="session-head__half">下午</span><span class="session-head__label">Session 3: Agentic AI in Finance &amp; Healthcare</span></div><button class="card talkrow reveal is-in" data-item="" data-slug="krishnaram-kenthapadi--trustworthy-multi-agent-ai-systems-for-healthcare" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">01:54</span><span class="talkrow__main"><span class="talkrow__title">醫療領域的可信多 Agent AI 系統:挑戰與經驗教訓</span><span class="talkrow__speaker" style="display:block"><strong>Krishnaram Kenthapadi</strong> · Chief Scientist, Oracle Health</span><span class="talkrow__summary">醫療 agent 的價值不在於模型多強,而在於把醫師從電子病歷的行政負擔中解放出來——而要真的落地,關鍵是領域知識(semantic knowledge graph)、雙向 guardrails、以及一套「線下評估會失效」的評估方法論。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="venkat-bhat--agentic-ai-applications-for-mental-health" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">02:08</span><span class="talkrow__main"><span class="talkrow__title">心理健康的 Agentic AI 應用:從聊天機器人到臨床流程協作</span><span class="talkrow__speaker" style="display:block"><strong>Venkat Bhat</strong> · Associate Professor; Director, AI for Mental Health (AI-M) Program, University of Toronto</span><span class="talkrow__summary">一位精神科醫師兼臨床試驗研究者的立場——在模擬環境裡表現良好的 multi-agent 系統只是第一步,心理健康領域真正缺的是隨機對照試驗;全世界用生成式 AI 工具做的 RCT 到現在只有一到兩個。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="shaghayegh-gharghabi--one-environment-whole-lifecycle-agentic-post-training-for-nemotron-in-finance" type="button" style="--reveal-delay: 0ms;"><span class="talkrow__time">02:23</span><span class="talkrow__main"><span class="talkrow__title">同一個環境貫穿整個生命週期:Nemotron 金融領域的 Agentic 後訓練</span><span class="talkrow__speaker" style="display:block"><strong>Shaghayegh Gharghabi</strong> · Deep Learning Scientist, NVIDIA</span><span class="talkrow__summary">NVIDIA 金融推理團隊要開源的不是一個 checkpoint,而是整條後訓練流水線——而且合成資料生成、SFT 與 RL 全部跑在同一個環境、同一套工具與格式上,把「訓練與推論不一致」這個問題從架構層消掉。</span></span><span class="badge badge--talk">演講</span></button></section><section class="session-group"><div class="session-head"><span class="session-head__half">下午</span><span class="session-head__label">Session 4: Secure Agentic AI</span></div><button class="card talkrow reveal is-in" data-item="" data-slug="jon-rav-shende--observability-is-not-governance" type="button" style="--reveal-delay: 45ms;"><span class="talkrow__time">02:30</span><span class="talkrow__main"><span class="talkrow__title">可觀測性不等於治理:為 Agentic AI 打造 Runtime Trust Plane</span><span class="talkrow__speaker" style="display:block"><strong>Jon-Rav Shende</strong> · Chief Technology Officer, Thales Group</span><span class="talkrow__summary">看得見 agent 在做什麼,不等於能對它做什麼;真正的治理要盯的不是 agent 而是控制路徑(control path),在執行提交之前用 declared vs observed 的差異、identity/policy/risk/evidence 四個維度做即時裁決。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="bo-li--securing-ai-agents" type="button" style="--reveal-delay: 90ms;"><span class="talkrow__time">02:47</span><span class="talkrow__main"><span class="talkrow__title">保護 AI Agent:從風險評估、執行期防護到自我改進與認證</span><span class="talkrow__speaker" style="display:block"><strong>Bo Li</strong> · Co-Founder and CEO, Virtue AI; UIUC</span><span class="talkrow__summary">AI 安全是所有 AI 應用的「最後一哩」,而這一哩可以拆成三個桶子——先用 red teaming 做壓力測試找出弱點,再從「修模型本體」與「掛上可即插即用的 AI firewall」兩路防護,最後讓 guardrail 帶上可證明的保證。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="milad-nasr--end-to-end-security-research-with-a-language-model" type="button" style="--reveal-delay: 135ms;"><span class="talkrow__time">03:01</span><span class="talkrow__main"><span class="talkrow__title">用語言模型做端到端的資安研究</span><span class="talkrow__speaker" style="display:block"><strong>Milad Nasr</strong> · Research Scientist, Anthropic</span><span class="talkrow__summary">兩年前一群前沿實驗室研究者預測「AI 做端到端研究要十年以上」,而講者用一篇本週剛發表的 7-round AES 密碼分析論文說明——這個預測錯得最離譜的不是編碼能力,而是研究能力;而且新的瓶頸已經從「想不想得到點子」變成「驗證得完不完」。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="itsik-mantin--when-good-agents-go-rogue" type="button" style="--reveal-delay: 180ms;"><span class="talkrow__time">03:14</span><span class="talkrow__main"><span class="talkrow__title">當好 agent 走上歪路</span><span class="talkrow__speaker" style="display:block"><strong>Itsik Mantin</strong> · Head of AI Security Research, Intuit</span><span class="talkrow__summary">Agent 不是自己變壞,而是被外部注入的內容綁架;只要 agent 會把「非你所控制」的資料吃進 context,它手上每一個工具權限就是攻擊者的爆炸半徑,防線只能靠最小權限、可信連接器、沙箱與 human-in-the-loop 疊起來。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="john-a-mcdermid--safety-and-security-of-agentic-ai" type="button" style="--reveal-delay: 225ms;"><span class="talkrow__time">03:25</span><span class="talkrow__main"><span class="talkrow__title">Agentic AI 的安全與資安</span><span class="talkrow__speaker" style="display:block"><strong>John A McDermid</strong> · Director, Centre for Assuring Autonomy, Institute for Safe Autonomy, University of York</span><span class="talkrow__summary">在 cyber-physical 系統裡,safety 與 security 傳統上被分開評估,但 agentic AI 讓攻擊面同時擴張到訓練管線與物理環境;用 structural causal world model 把兩者接起來後會發現——單獨都安全的兩個攻擊,只要改變發生順序就能組合成致命結果。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="mohamed-nabeel--ghost-in-the-web-store" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">03:38</span><span class="talkrow__main"><span class="talkrow__title">Web Store 裡的幽靈:先攻擊者一步堵住 LLM 幻覺型瀏覽器擴充套件供應鏈攻擊</span><span class="talkrow__speaker" style="display:block"><strong>Mohamed Nabeel</strong> · Senior Principal Researcher, Palo Alto Networks</span><span class="talkrow__summary">LLM 會「有自信地」推薦根本不存在、已下架或無人認領的瀏覽器擴充套件,攻擊者只要把這些幻覺名稱註冊回來,就能不必入侵任何系統、直接讓 AI 幫他們開門——他們的做法是先去找這些幽靈,在攻擊者把它們復活之前。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="workshop--future-of-agent-evaluation" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">03:45</span><span class="talkrow__main"><span class="talkrow__title">Agent 評估的未來</span><span class="talkrow__speaker" style="display:block"><strong>Berkeley RDI(逐字稿中三位講者:AgentBeats / Agents' Last Exam 主講者、Jun、Joy;議程未列講者名單)</strong> · UC Berkeley RDI 及合作機構 / UC Berkeley RDI and collaborators</span><span class="talkrow__summary">這場 workshop 用「一個標準 + 三個 benchmark」回答 agent 評估該往哪走——AgentBeats 把 benchmark 本身變成 agent 來消除 N×N 的整合成本,Agents' Last Exam 問「agent 能不能做有經濟價值的真實工作」,frontier cyber 評估問「agent 在漏洞生命週期各階段有多強」,verifiable code generation 則問「agent 能不能證明自己寫的程式是對的」。</span></span><span class="badge badge--workshop">工作坊</span></button></section>
