<header class="pagehead reveal is-in" style="--reveal-delay: 0ms;"><p class="kicker">8 月 1 日(六)</p><h1>Atlas Stage</h1><div class="pagehead__meta"><span>17 場 · 3 個場次</span><a href="https://www.youtube.com/watch?v=WeriQic-QW0" target="_blank" rel="noopener"><span class="material-symbols-rounded" aria-hidden="true">play_circle</span>上午場直播</a><a href="https://www.youtube.com/watch?v=psPzCQbjCCo" target="_blank" rel="noopener"><span class="material-symbols-rounded" aria-hidden="true">play_circle</span>下午場直播</a></div></header><div class="controls"><div class="searchwrap"><span class="material-symbols-rounded" aria-hidden="true">search</span><input id="search" type="search" placeholder="搜尋演講、講者、主題…" value="" aria-label="搜尋演講、講者、主題…"></div><div class="chiprow"><button class="chip active" data-filter="all" aria-pressed="true">全部</button><button class="chip" data-filter="keynote" aria-pressed="false">主題演講</button><button class="chip" data-filter="talk" aria-pressed="false">演講</button><button class="chip" data-filter="workshop" aria-pressed="false">工作坊</button><span class="result-count">17 / 17 場</span></div></div><section class="session-group"><div class="session-head"><span class="session-head__half">上午</span><span class="session-head__label">Session 1: Foundational Capabilities</span></div><button class="card talkrow reveal is-in" data-item="" data-slug="jianfeng-gao--agentic-modeling-via-internalizing-agent-harnesses" type="button" style="--reveal-delay: 45ms;"><span class="talkrow__time">00:01</span><span class="talkrow__main"><span class="talkrow__title">把 Agent Harness 內化進模型:Agentic Modeling 的新典範</span><span class="talkrow__speaker" style="display:block"><strong>Jianfeng Gao</strong> · Technical Fellow &amp; Corporate Vice President, Microsoft Research</span><span class="talkrow__summary">語言模型本身只是個「說話的人」,是外掛的 agent harness 讓它變成「做事的人」;下一步是把 harness 的能力用 post-training 蒸餾回模型本身,而 harness 之於 agentic modeling,就等同於網路資料之於 pre-training。</span></span><span class="badge badge--keynote">主題演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="sanja-fidler--world-models-for-physical-ai-simulation" type="button" style="--reveal-delay: 90ms;"><span class="talkrow__time">00:17</span><span class="talkrow__main"><span class="talkrow__title">用於 Physical AI 模擬的世界模型</span><span class="talkrow__speaker" style="display:block"><strong>Sanja Fidler</strong> · Associate Professor, University of Toronto; Former VP of AI Research, Nvidia</span><span class="talkrow__summary">機器人開發的瓶頸不是模型而是模擬——真實機器人只能以物理時間跑,而生成式世界模型能在 GPU 上以超即時速度「想像」出無限多的長尾場景;過去一年這項技術從「5 秒影片要跑 5 分鐘」變成「即時互動」,現在連消費級顯示卡都跑得動。</span></span><span class="badge badge--keynote">主題演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="giambattista-parascandolo--when-language-models-learned-to-reason" type="button" style="--reveal-delay: 135ms;"><span class="talkrow__time">00:32</span><span class="talkrow__main"><span class="talkrow__title">當語言模型學會推理的那一刻</span><span class="talkrow__speaker" style="display:block"><strong>Giambattista Parascandolo</strong> · Research Fellow, OpenAI</span><span class="talkrow__summary">他拿出四、五年前 OpenAI 內部最早討論 reasoning 的原始投影片,展示當年那個「模型多想一會兒也給不出更好答案」的世界,以及讓團隊決定放手擴張的第一批證據——原來是幾張數馬鈴薯袋子的醜投影片。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="aditya-grover--redefining-the-token-efficiency-frontier-with-diffusion-llms" type="button" style="--reveal-delay: 180ms;"><span class="talkrow__time">00:41</span><span class="talkrow__main"><span class="talkrow__title">用 Diffusion LLM 重新定義 Token 效率的前沿</span><span class="talkrow__speaker" style="display:block"><strong>Aditya Grover</strong> · Co-Founder/CTO, Inception Labs</span><span class="talkrow__summary">AI 的每一次大躍進都來自「把某件事平行化」——先是 GPU 平行化矩陣乘法,再是 Transformer 平行化訓練,而下一步是用 diffusion 平行化生成本身;當智慧本身已不稀缺,真正的新貨幣是 intelligence per watt。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="workshop--turning-chatbots-into-agents" type="button" style="--reveal-delay: 225ms;"><span class="talkrow__time">01:08</span><span class="talkrow__main"><span class="talkrow__title">把聊天機器人變成 Agent:現代 RL 長什麼樣子</span><span class="talkrow__speaker" style="display:block"><strong>Lovre Pesut; Muhammad Hashmi</strong> · AI Engineer, Daytona; DevRel, Daytona</span><span class="talkrow__summary">同樣的 harness、同樣的工具,GPT-2 會直接崩潰而 Kimi K3 能自己修 bug——中間的差別叫 reinforcement learning;而現代 RL 的真正瓶頸不在演算法,在於「誰來提供幾千萬個一次性沙箱」與「環境本身已經變成新的資料」。</span></span><span class="badge badge--workshop">工作坊</span></button></section><section class="session-group"><div class="session-head"><span class="session-head__half">下午</span><span class="session-head__label">Session 2: Robotics &amp; World Models</span></div><button class="card talkrow reveal is-in" data-item="" data-slug="peter-stone--outplaying-elite-table-tennis-players-with-an-autonomous-robot" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">00:14</span><span class="talkrow__main"><span class="talkrow__title">用自主機器人擊敗頂尖桌球選手</span><span class="talkrow__speaker" style="display:block"><strong>Peter Stone</strong> · Chief Scientist, Sony AI; Professor, UT Austin</span><span class="talkrow__summary">Sony AI 的 Ace 是第一個在官方規則下、面對面擊敗職業排名選手的自主機器人——證明 AI agent 已經能在「需要毫秒級即時決策的物理空間任務」上達到專家水準,而做到這件事靠的是感知、強化學習與硬體三者同時被推到極限,而非任何單點突破。</span></span><span class="badge badge--keynote">主題演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="vincent-vanhoucke--trustworthy-agents-in-the-real-world" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">00:29</span><span class="talkrow__main"><span class="talkrow__title">真實世界中值得信任的 Agent:物理自主性給 Agentic AI 時代的教訓</span><span class="talkrow__speaker" style="display:block"><strong>Vincent Vanhoucke</strong> · Distinguished Engineer, Waymo</span><span class="talkrow__summary">Waymo 就是一家 agentic AI 公司,只是它的 agent 是四個輪子的金屬塊;而機器人領域二十年來踩過的坑——可靠度的「九」要靠重新設計系統換來、Level 3 是最難受的位置、逐步最佳化必然漂移——現在正一模一樣地打在 agentic AI 身上,而共同的解方是你得先有一個世界模型。</span></span><span class="badge badge--keynote">主題演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="trevor-darrell--real-world-reasoning-agents" type="button" style="--reveal-delay: 0ms;"><span class="talkrow__time">00:44</span><span class="talkrow__main"><span class="talkrow__title">面向真實世界的推理 Agent</span><span class="talkrow__speaker" style="display:block"><strong>Trevor Darrell</strong> · Professor, UC Berkeley</span><span class="talkrow__summary">要讓 agent 真正在物理世界裡運作,它得會看(看得出兩張圖之間那個關鍵的小差異)、會摸(靠觸覺即時反應而不只是視覺規劃),還得會在抽象層次上推理運動(預測 SE(3) 位姿軌跡,而不是預測每一個像素)。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="manmohan-chandraker--making-autonomy-autonomous" type="button" style="--reveal-delay: 45ms;"><span class="talkrow__time">00:55</span><span class="talkrow__main"><span class="talkrow__title">讓自主變得自主:邁向可供發現與直覺的心智模型</span><span class="talkrow__speaker" style="display:block"><strong>Manmohan Chandraker</strong> · Professor, University of California, San Diego</span><span class="talkrow__summary">physical AI 的 edge case 永遠修不完,所以應該讓 agent 團隊自己跑「發現—實驗—驗證—寫論文」的迴圈;而讓這件事不淪為幻覺的關鍵,是每一個宣稱都能追溯到一次真實的 GPU run、一行真實的程式碼,而人類的角色則從執行者轉為提供隱性專業知識與意圖的一方。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="bolei-zhou--scaling-sidewalk-autonomy-with-world-models" type="button" style="--reveal-delay: 90ms;"><span class="talkrow__time">01:04</span><span class="talkrow__main"><span class="talkrow__title">用世界模型擴展人行道自主性</span><span class="talkrow__speaker" style="display:block"><strong>Bolei Zhou</strong> · Associate Professor, UCLA; Chief AI Scientist, Coco Robotics</span><span class="talkrow__summary">人行道自主性的瓶頸不是模型不夠多,而是沒辦法在部署前公平評估它們;而解法是把真實世界的影片當成「原始碼」,重建成可互動的模擬環境,再從一支影片長出多個「數位表親」來訓練與評估。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="workshop--open-source-agent-investigations" type="button" style="--reveal-delay: 135ms;"><span class="talkrow__time">01:14</span><span class="talkrow__main"><span class="talkrow__title">開源 Agent 調查:Security Arena、蒸餾 Traces 與自動最佳化</span><span class="talkrow__speaker" style="display:block"><strong>Devina Jain; Zach Mueller; Chuan Li</strong> · Research Engineer, Lambda; Head of Developer Relations, Lambda; Chief Science Officer, Lambda</span><span class="talkrow__summary">Lambda 用三個開源實驗回答同一個問題——我們對 agent 到底知道什麼是真的? 攻防競賽發現有效的 prompt injection 是跨場景可遷移的修辭形狀;300M token 的 trace 蒸餾發現決定表現的常常是 harness 而不是模型;而讓 Claude Code 帶著實驗追蹤器自己做研究,發現關鍵不是它多聰明,而是它有沒有把東西寫下來。</span></span><span class="badge badge--workshop">工作坊</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="workshop--building-agentic-apps-with-replit-agent" type="button" style="--reveal-delay: 180ms;"><span class="talkrow__time">02:14</span><span class="talkrow__main"><span class="talkrow__title">用 Replit Agent 端到端打造 Agentic 應用</span><span class="talkrow__speaker" style="display:block"><strong>Brandon Middleton</strong> · Head of Education, Replit</span><span class="talkrow__summary">這場名為「用 Replit Agent 蓋 app」的 workshop,實際上有四分之三在談教育——當資訊與智慧都變得充沛,大學那套「用時數換學習、用學歷換能力、用排序換教育」的設計就失效了;而 vibe coding 的意義不是省下寫程式的時間,是讓一個 15 歲高中生、一個沒有 CS 背景的音樂人、甚至 Shaquille O'Neal,都能把自己的想法直接做成能用的東西。</span></span><span class="badge badge--workshop">工作坊</span></button></section><section class="session-group"><div class="session-head"><span class="session-head__half">下午</span><span class="session-head__label">Session 3: Frameworks &amp; Dev Platforms</span></div><button class="card talkrow reveal is-in" data-item="" data-slug="philip-rathle--graphs-are-the-knowledge-layer-for-agentic-ai" type="button" style="--reveal-delay: 225ms;"><span class="talkrow__time">03:14</span><span class="talkrow__main"><span class="talkrow__title">圖(Graph)就是 Agentic AI 的知識層</span><span class="talkrow__speaker" style="display:block"><strong>Philip Rathle</strong> · CTO, Neo4j</span><span class="talkrow__summary">企業裡談的 knowledge、context、semantics、memory、ontology 其實是同一件事的不同切面,它們最終會收斂成一層「enterprise knowledge layer」,而這一層最自然的實作是圖——因為現實世界的資料本來就長成網路、階層與路徑。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="josh-albrecht--building-punk-software-an-open-agent-stack" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">03:29</span><span class="talkrow__main"><span class="talkrow__title">打造 Punk Software:一套全開放的 Agent 技術棧</span><span class="talkrow__speaker" style="display:block"><strong>Josh Albrecht</strong> · Co-founder and CTO, Imbue</span><span class="talkrow__summary">AI 對人類物種也許沒有滅絕風險,但對「你」和你的事業有——因為整條 frontier AI 供應鏈掌握在少數幾家公司手上;解法是把整個 stack 開放,自己動手做 punk software。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="woosuk-kwon--vllm-building-open-and-efficient-inference-for-agents" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">03:44</span><span class="talkrow__main"><span class="talkrow__title">vLLM:為 Agent 打造開放且高效的推論引擎</span><span class="talkrow__speaker" style="display:block"><strong>Woosuk Kwon</strong> · Co-Founder &amp; CTO, Inferact</span><span class="talkrow__summary">Agent 幾乎沒有改變推論的 API,卻徹底改變了 API 底下的一切——vLLM 因此沿三條軸線重寫自己:workload-aware 的模型平行化、動態分層的 KV cache,以及能吃下地球上任何一種運算的多硬體後端。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="banghua-zhu--building-frontier-inference-and-training-infra-for-agent" type="button" style="--reveal-delay: 0ms;"><span class="talkrow__time">04:01</span><span class="talkrow__main"><span class="talkrow__title">為 Agent 打造前沿推論與訓練基礎設施:SGLang 與 Miles 的案例</span><span class="talkrow__speaker" style="display:block"><strong>Banghua Zhu</strong> · Co-Founder, RadixArk</span><span class="talkrow__summary">2026 是 agentic infrastructure 之年——推論端的壓力來自 cache 重用率、trillion 級模型與百萬 context,訓練端的壓力則來自環境多樣性與 train–inference mismatch,而 RadixArk 用 SGLang 與 Miles 兩個開源專案分別回應。</span></span><span class="badge badge--talk">演講</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="ranjan-sinha--speaking-the-same-language-nlip-for-agent-interoperability" type="button" style="--reveal-delay: 45ms;"><span class="talkrow__time">04:14</span><span class="talkrow__main"><span class="talkrow__title">說同一種語言:用 NLIP 達成 Agent 互通</span><span class="talkrow__speaker" style="display:block"><strong>Ranjan Sinha</strong> · IBM Fellow, CTO &amp; VP for watsonx, Enterprise AI, IBM</span><span class="talkrow__summary">傳統協定要求兩端與線路上講同一種語言,一改 schema 就斷;NLIP 把這個假設拿掉——只要兩端都有智慧可以翻譯,agent 各講各的也能互通,而它自己只用五個欄位就把「意圖」搬過去。</span></span><span class="badge badge--talk">演講</span></button></section>
