<header class="pagehead reveal is-in" style="--reveal-delay: 0ms;"><p class="kicker">Sunday, August 2</p><h1>Compass Stage</h1><div class="pagehead__meta"><span>30 talks · 4 sessions</span><a href="https://www.youtube.com/watch?v=l8GS08n-25Q" target="_blank" rel="noopener"><span class="material-symbols-rounded" aria-hidden="true">play_circle</span>Morning stream</a><a href="https://www.youtube.com/watch?v=1UrriPJRSPU" target="_blank" rel="noopener"><span class="material-symbols-rounded" aria-hidden="true">play_circle</span>Afternoon stream</a></div></header><div class="controls"><div class="searchwrap"><span class="material-symbols-rounded" aria-hidden="true">search</span><input id="search" type="search" placeholder="Search talks, speakers, topics…" value="" aria-label="Search talks, speakers, topics…"></div><div class="chiprow"><button class="chip active" data-filter="all" aria-pressed="true">All</button><button class="chip" data-filter="keynote" aria-pressed="false">Keynote</button><button class="chip" data-filter="talk" aria-pressed="false">Talk</button><button class="chip" data-filter="workshop" aria-pressed="false">Workshop</button><span class="result-count">30 / 30 talks</span></div></div><section class="session-group"><div class="session-head"><span class="session-head__half">AM</span><span class="session-head__label">Session 1: AI Safety</span></div><button class="card talkrow reveal is-in" data-item="" data-slug="chris-bregler--deepfakes-and-more" type="button" style="--reveal-delay: 45ms;"><span class="talkrow__time">00:00</span><span class="talkrow__main"><span class="talkrow__title">Deepfakes and More: How Agents with New Tools Can Mitigate and Provide More Context</span><span class="talkrow__speaker" style="display:block"><strong>Chris Bregler</strong> · Senior Director / Distinguished Scientist, Google DeepMind; Academy Scientific and Technical Award Winner</span><span class="talkrow__summary">The real information battle isn't "is this pixel fake" — in over half the harmful cases the pixels are untouched and the lie lives in the context; so Google is shifting from deepfake detectors to context-investigating agents (Backstory), and argues the root causes are social-scientific, not purely technical.</span></span><span class="badge badge--keynote">Keynote</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="kathy-baxter--the-human-in-the-loop" type="button" style="--reveal-delay: 90ms;"><span class="talkrow__time">00:16</span><span class="talkrow__main"><span class="talkrow__title">The Human in the Loop: Navigating the Realities of AI for Employee Flourishing</span><span class="talkrow__speaker" style="display:block"><strong>Kathy Baxter</strong> · VP / Principal Architect, Responsible AI &amp; Tech, Salesforce</span><span class="talkrow__summary">Negative alignment — stopping models from causing harm — has driven the whole field of AI ethics, but it isn't sufficient for human flourishing; we also need positive alignment, actively designing systems that cultivate human judgment through optimized workflows, deliberate "mindful friction," and organizational respect for human craftsmanship.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="lovedeep-gondara--trustworthy-agentic-ai-in-regulated-domains" type="button" style="--reveal-delay: 135ms;"><span class="talkrow__time">00:25</span><span class="talkrow__main"><span class="talkrow__title">Trustworthy Agentic AI in Regulated Domains: Robustness, Privacy, and Accountability as Co-Design Imperatives</span><span class="talkrow__speaker" style="display:block"><strong>Lovedeep Gondara</strong> · Head of AI R&amp;D, Vanguard; Adjunct Professor, University of British Columbia</span><span class="talkrow__summary">In agentic systems trustworthiness is a systems property, not a model property — robustness, privacy, and accountability actively contradict one another — so the interesting research question isn't how to push everything to full autonomy, but how to make level 2 and level 3 useful, safe, and provably compliant.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="alex-obadia--a-society-of-agents" type="button" style="--reveal-delay: 180ms;"><span class="talkrow__time">00:34</span><span class="talkrow__main"><span class="talkrow__title">A Society of Agents: Trust at Machine Speed, from Bits to Atoms</span><span class="talkrow__speaker" style="display:block"><strong>Alex Obadia</strong> · Programme Director, Advanced Research &amp; Invention Agency (ARIA)</span><span class="talkrow__summary">ARIA's £50M Scaling Trust programme funds the research and infrastructure that lets agents with *different owners* coordinate securely at machine speed without intermediaries — and insists the stack be an open-source public good, because monoculture would leave humanity less resilient to shocks and erode our agency over time.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="neil-lawrence--viable-systems-judgment-and-ai-safety" type="button" style="--reveal-delay: 225ms;"><span class="talkrow__time">00:45</span><span class="talkrow__main"><span class="talkrow__title">Viable Systems, Judgment, and AI Safety</span><span class="talkrow__speaker" style="display:block"><strong>Neil Lawrence</strong> · Chief Scientist and Co-founder, Trent AI</span><span class="talkrow__summary">Computers do accounting extremely well and accountability not at all — they can't be jailed, embarrassed, or fired. Separate the accounts from the accountability and you strand a human who doesn't understand the accounts but still has to sign them off, which is exactly where agentic AI is stalling in enterprises.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="huan-sun--smarter-and-safer-everyday" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">00:50</span><span class="talkrow__main"><span class="talkrow__title">Smarter and Safer Everyday? Continual Learning and Safety in Computer-Use Agents</span><span class="talkrow__speaker" style="display:block"><strong>Huan Sun</strong> · Associate Professor, The Ohio State University</span><span class="talkrow__summary">Distribution shift is both where an agent most needs to keep learning after deployment and where safety failures most easily emerge and get missed — an unexplored, dangerous tension, because a reward signal that only tracks task success will reinforce unsafe behaviour update after update.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="eric-aldana--earning-autonomy-governance-as-code" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">00:56</span><span class="talkrow__main"><span class="talkrow__title">Earning Autonomy: Governance as Code for the Agentic Enterprise</span><span class="talkrow__speaker" style="display:block"><strong>Eric Aldana</strong> · Head of Product, Credo AI(代 Navrina Singh 上台 / standing in for Navrina Singh, CEO &amp; Founder, Credo AI)</span><span class="talkrow__summary">Enterprises never grant a newcomer full authority on day one — interns and traders climb a ladder of earned authority — yet agents typically receive full authority the moment they're deployed. That's a design error, and the fix is compiling the governance plan directly into the agent's harness.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="workshop--infrastructure-you-can-talk-to" type="button" style="--reveal-delay: 0ms;"><span class="talkrow__time">01:02</span><span class="talkrow__main"><span class="talkrow__title">Infrastructure You Can Talk To</span><span class="talkrow__speaker" style="display:block"><strong>Jeff Price</strong> · Field CTO of North America, SUSE</span><span class="talkrow__summary">With patch windows compressed from quarterly to four hours, the bottleneck stopped being capability and became process — so put MCP servers into the Linux and Kubernetes layer, let agents read the whole fleet, prioritize, and open the tickets, while writes stay gated behind a human clicking approve.</span></span><span class="badge badge--workshop">Workshop</span></button></section><section class="session-group"><div class="session-head"><span class="session-head__half">PM</span><span class="session-head__label">Session 2: AI Systems</span></div><button class="card talkrow reveal" data-item="" data-slug="jun-yang--using-agents-to-build-production-ai-systems" type="button" style="--reveal-delay: 45ms;"><span class="talkrow__time">00:02</span><span class="talkrow__main"><span class="talkrow__title">Using Agents to Build Production AI Systems: Lessons, Pitfalls, and Limits</span><span class="talkrow__speaker" style="display:block"><strong>Jun Yang</strong> · Senior Director of Compute Architecture, NVIDIA</span><span class="talkrow__summary">After putting agents into NVIDIA's production inference and training software workflow, the bottleneck turned out not to be whether agents can write code but whether their output survives a human completeness review — only 73 of 313 agent-authored bug fixes landed on main — so the harness should stay lightweight and ride the foundation model's evolution rather than becoming a heavy framework of its own.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="rick-crawford--from-agent-demos-to-production" type="button" style="--reveal-delay: 90ms;"><span class="talkrow__time">00:13</span><span class="talkrow__main"><span class="talkrow__title">From Agent Demos to Production: How Postman Is Building Reliable AI Agent Infrastructure</span><span class="talkrow__speaker" style="display:block"><strong>Rick Crawford</strong> · Field CTO, Postman(官網議程列為 Ankit Sobti, Co-Founder &amp; CTO, Postman;現場為代講)</span><span class="talkrow__summary">Postman used its own enterprise sales process as the testbed and found that a swarm of agents compounds both cost and confusion; the fix was to build one monolith agent that knows the whole domain and then layer a hallucination guard, domain personas, human-owned strategic content, and role-scoped authorization on top — with a help → recommend → act → own autonomy curve deciding how far the agent goes in each scenario.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="rahul-bakshi--scale-compute-to-the-signal" type="button" style="--reveal-delay: 135ms;"><span class="talkrow__time">00:23</span><span class="talkrow__main"><span class="talkrow__title">Scale Compute to the Signal</span><span class="talkrow__speaker" style="display:block"><strong>Rahul Bakshi</strong> · Director, Applied Science (Edge AI), Amazon</span><span class="talkrow__summary">Everyone asks how to give agents more compute, but at the edge there is a hard ceiling drawn by human skin's heat tolerance — roughly 1–1.5 W — so the real question is whether a task earns an escalation to the next tier; and what's missing isn't a model, it's a composable runtime that budgets sensors, radio, and compute per task.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="john-liu--looping-for-model-optimization" type="button" style="--reveal-delay: 180ms;"><span class="talkrow__time">00:30</span><span class="talkrow__main"><span class="talkrow__title">Looping for Model Optimization</span><span class="talkrow__speaker" style="display:block"><strong>John Liu</strong> · Principal Product Manager, AWS</span><span class="talkrow__summary">Model optimization on AWS Trainium is already a multi-layer, multi-variable nested loop and therefore a natural fit for agents; what decides success isn't the loop architecture but five counterintuitive lessons — above all that the part of your system that measures performance *will* be manipulated by the agent, and that a carefully built knowledge base has a shelf life and should be periodically deleted to check whether performance improves.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="jongryool-kim--disaggregated-llm-serving-with-shared-memory-kv-cache" type="button" style="--reveal-delay: 225ms;"><span class="talkrow__time">00:36</span><span class="talkrow__main"><span class="talkrow__title">Disaggregated LLM Serving with Shared Memory KV Cache at Rack-Scale</span><span class="talkrow__speaker" style="display:block"><strong>Jongryool Kim</strong> · Senior Director / Head of AI System Infra., SK hynix</span><span class="talkrow__summary">Put a physically disaggregated memory pool in the middle of the rack so multiple nodes see the *same* address space, and the KV cache no longer has to be shuttled between nodes over RDMA — prefill writes once, decode reads directly, the old KV cache stays in the pool for the next request's reuse, and GPU HBM is freed immediately while PCIe contention disappears.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="ben-athiwaratkun--unified-orchestration-system-for-verifier-free-evolution" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">00:41</span><span class="talkrow__main"><span class="talkrow__title">Unified Orchestration System for Verifier-Free Evolution</span><span class="talkrow__speaker" style="display:block"><strong>Ben Athiwaratkun</strong> · Senior Director, Core ML (Turbo), Together AI</span><span class="talkrow__summary">Strip the external verifier out of evolutionary search and a single model degrades its own solutions — it simply doesn't carry enough entropy. Squeeze Evolve's answer is to run one evolution loop across multiple heterogeneous models, routing hard solutions to expensive models and easy ones to cheap models, which fixes diversity and cost at once: 97.5% on ARC-AGI in fewer evolution steps at meaningfully lower cost per task.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="tushar-krishna--how-agentic-ai-is-rewriting-the-rules-of-ai-infrastructure" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">00:48</span><span class="talkrow__main"><span class="talkrow__title">How Agentic AI Is Rewriting the Rules of AI Infrastructure</span><span class="talkrow__speaker" style="display:block"><strong>Tushar Krishna</strong> · Associate Professor, Georgia Tech; CEO, InfraVana</span><span class="talkrow__summary">Today's inference serving stacks were built for the chatbot era — one model at a time, static execution paths, independent requests, homogeneous hardware — while agentic workloads bring dynamism and heterogeneity that open up trillions of cross-dependent choices where the odds of choosing wrong are high and the cost of choosing wrong is higher; the only way out is optimizing across the whole stack, which first requires being able to measure it.</span></span><span class="badge badge--talk">Talk</span></button></section><section class="session-group"><div class="session-head"><span class="session-head__half">PM</span><span class="session-head__label">Session 3: Enterprise AI</span></div><button class="card talkrow reveal" data-item="" data-slug="eno-reyes--building-the-software-factory" type="button" style="--reveal-delay: 0ms;"><span class="talkrow__time">00:53</span><span class="talkrow__main"><span class="talkrow__title">Building the Software Factory</span><span class="talkrow__speaker" style="display:block"><strong>Eno Reyes</strong> · Co-Founder / CTO, Factory AI</span><span class="talkrow__summary">Every software company already runs an implicit loop — signals in, triage, plan, code, validate, ship, new signals out — but almost nobody models it explicitly; the "software factory" makes that loop explicit so signals can flow to deployed software without human intervention, and the new human job is to build, govern, and refine the factory.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="ankit-goyal--infrastructure-for-long-running-agents" type="button" style="--reveal-delay: 45ms;"><span class="talkrow__time">01:08</span><span class="talkrow__main"><span class="talkrow__title">Infrastructure for Long-Running Agents</span><span class="talkrow__speaker" style="display:block"><strong>Ankit Goyal</strong> · Principal Staff Software Engineer, LinkedIn</span><span class="talkrow__summary">LinkedIn treats an agent as just another job on its ML platform, but because agent-written code is untrusted and agents launch hundreds of jobs in minutes, the infrastructure had to be rethought along three axes — UX, compute, and trust — and experiment volume doubled in six months.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="daniel-homola--from-multi-agent-patterns-to-reliable-orchestration" type="button" style="--reveal-delay: 90ms;"><span class="talkrow__time">01:14</span><span class="talkrow__main"><span class="talkrow__title">From Multi-Agent Patterns to Reliable Orchestration</span><span class="talkrow__speaker" style="display:block"><strong>Daniel Homola</strong> · Lead AI Engineer, BMW Research</span><span class="talkrow__summary">Handoffs, agents-as-tools, and routing all collapse into the same runtime decision — who should handle this piece of work — so reliable multi-agent systems come from making that delegation decision measurable, context-aware, and tolerant of the fact that there is often more than one right answer.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="nayaki-nayyar--transforming-from-saas-to-an-agentic-enterprise" type="button" style="--reveal-delay: 135ms;"><span class="talkrow__time">01:20</span><span class="talkrow__main"><span class="talkrow__title">Transforming from SaaS to an Agentic Enterprise</span><span class="talkrow__speaker" style="display:block"><strong>Nayaki Nayyar</strong> · CEO, Siteimprove</span><span class="talkrow__summary">When content volume is effectively infinite and everyone is a creator, scanning and fixing after the fact no longer works; Siteimprove's answer is to shift compliance left into the moment of creation, wiring its agents directly into AI building tools like Lovable and VS Code through an MCP server.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="surbhi-rathore--agentic-ai-is-a-ux-problem" type="button" style="--reveal-delay: 180ms;"><span class="talkrow__time">01:27</span><span class="talkrow__main"><span class="talkrow__title">Agentic AI Is a UX Problem Disguised as a Technology Breakthrough</span><span class="talkrow__speaker" style="display:block"><strong>Surbhi Rathore</strong> · VP, AI Products &amp; Strategy, Invoca</span><span class="talkrow__summary">Models have become largely interchangeable, so what decides an agent's fate isn't whether it can execute the workflow but whether it earns trust from a user who arrived already expecting it to fail — and that's a design problem, not a model problem.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="daniel-fink--scaling-up-config-driven-multi-agent-networks-with-neuro-san" type="button" style="--reveal-delay: 225ms;"><span class="talkrow__time">01:34</span><span class="talkrow__main"><span class="talkrow__title">Scaling Up Config-Driven Multi-Agent Networks with Neuro SAN</span><span class="talkrow__speaker" style="display:block"><strong>Daniel Fink</strong> · AI Engineering Lead, Cognizant</span><span class="talkrow__summary">Two and a half years ago Cognizant AI Lab concluded that the glue code of agents calling agents was the noise, so they lifted the whole agent network into configuration files — which let non-engineers build systems, and grew the corporate intranet into a network of ~200 leaf agents that cut ticket volume by about 30%.</span></span><span class="badge badge--talk">Talk</span></button></section><section class="session-group"><div class="session-head"><span class="session-head__half">PM</span><span class="session-head__label">Session 4: Agent Evaluation &amp; Benchmarks</span></div><button class="card talkrow reveal" data-item="" data-slug="debarshi-raha--preferences-over-benchmarks-model-routing" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">01:41</span><span class="talkrow__main"><span class="talkrow__title">Preferences &gt; Benchmarks: Model Routing for How Teams Actually Build</span><span class="talkrow__speaker" style="display:block"><strong>Debarshi Raha</strong> · VP &amp; Fellow Engineer, DigitalOcean</span><span class="talkrow__summary">Public leaderboards know nothing about your cost ceiling, your latency budget, or your data, so model routing shouldn't follow benchmark rankings — it should encode *your preferences* into a server-side router driven by a purpose-built small model that reranks candidates on live cost and latency; DigitalOcean's open-source Plano plus a 30B routing model does this at under 200ms, with zero client-side code changes, for free.</span></span><span class="badge badge--keynote">Keynote</span></button><button class="card talkrow reveal" data-item="" data-slug="yuan-emily-xue--the-exam-before-enterprise-deployment" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">01:58</span><span class="talkrow__main"><span class="talkrow__title">The Exam Before Enterprise Deployment</span><span class="talkrow__speaker" style="display:block"><strong>Yuan (Emily) Xue</strong> · Head of Enterprise AI, Scale AI</span><span class="talkrow__summary">Today's benchmarks measure a *ceiling* — how far models are from the top of human intelligence — and are deliberately kept from saturating; enterprises need the opposite measurement, *deployment readiness*: can this use case ship today, what human-oversight cost buys the 99% reliability it requires, and how does that cost fall as models improve. Reliability is a constraint, not a tradeable variable.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="chenguang-wang--from-training-to-evaluation-open-recipes" type="button" style="--reveal-delay: 0ms;"><span class="talkrow__time">02:11</span><span class="talkrow__main"><span class="talkrow__title">From Training to Evaluation: Open Recipes for Building Agentic AI at Scale AI</span><span class="talkrow__speaker" style="display:block"><strong>Chenguang Wang</strong> · Assistant Professor, UC Santa Cruz; Research Advisor, Scale AI</span><span class="talkrow__summary">RL used to work only in verifiable domains like math and code; rubric-based rewards turn open-ended grading criteria into verification signals, pushing RL into science and open-ended tasks — and the same idea reshapes evaluation (SWE-Atlas, a drug discovery bench, synthetically generated long-horizon computer-use tasks), with failure modes flowing back into training as a flywheel meant to run forever.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="zelin-wan--measuring-api-agent-reliability-long-horizon" type="button" style="--reveal-delay: 45ms;"><span class="talkrow__time">02:24</span><span class="talkrow__main"><span class="talkrow__title">Measuring API Agent Reliability for Long-Horizon Tasks in Production</span><span class="talkrow__speaker" style="display:block"><strong>Zelin Wan</strong> · Senior AI Engineer, Postman</span><span class="talkrow__summary">On single API tasks every model scores 88–97%, which looks like a solved problem; chain those same tasks into a dependent sequence and scores collapse to 44–73%. The tasks didn't get harder — one small early mistake gets amplified downstream into a broken result, which is exactly the difference between answering and executing.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="rahul-krishna--scarfbench-can-agents-migrate-enterprise-java" type="button" style="--reveal-delay: 90ms;"><span class="talkrow__time">02:34</span><span class="talkrow__main"><span class="talkrow__title">ScarfBench: Can Agents Migrate Enterprise Java?</span><span class="talkrow__speaker" style="display:block"><strong>Rahul Krishna</strong> · Senior Research Scientist, IBM Software Innovation Labs</span><span class="talkrow__summary">Enterprise Java behavior largely lives in framework proxies, reflection, and interceptors rather than in the source, so there is no one-to-one equivalence between frameworks. The result: coding agents are very good at producing migrations that compile and deploy, yet only 2–14% actually preserve the source application's behavior — compilation is a deceptive signal.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="grace-tang--data-benchmarks-everythings-made-up" type="button" style="--reveal-delay: 135ms;"><span class="talkrow__time">02:43</span><span class="talkrow__main"><span class="talkrow__title">Data Benchmarks: Where Everything's Made Up and the Points Don't Matter</span><span class="talkrow__speaker" style="display:block"><strong>Grace Tang</strong> · AI @ Hex</span><span class="talkrow__summary">Great frontier benchmarks share one trait — the problems are genuinely hard for agents *and* for people. Public data-analytics benchmarks are mostly multiple-choice questions, Kaggle exercises, and underspecified pseudo-questions that look nothing like an analyst's day job — so Hex built its own entirely fictional but convincingly messy company, Shorelane, to test against.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="arindam-sett--aidar-ai-data-readiness-evaluations-framework" type="button" style="--reveal-delay: 180ms;"><span class="talkrow__time">02:49</span><span class="talkrow__main"><span class="talkrow__title">AIDaR: AI Data Readiness Evaluations Framework</span><span class="talkrow__speaker" style="display:block"><strong>Arindam Sett</strong> · Principal ML Engineer, Genentech</span><span class="talkrow__summary">Agents don't perform in a vacuum — they run on top of a data layer. When your agent's eval scores look bad, the cause is often neither the prompt nor the model but a data layer built for dashboards and reporting rather than for agents. So evaluating agents requires evaluating data readiness alongside them.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="scott-clark--how-better-evals-can-bring-abundance" type="button" style="--reveal-delay: 225ms;"><span class="talkrow__time">02:54</span><span class="talkrow__main"><span class="talkrow__title">How Better Evals Can Bring Abundance Through Accelerated Scientific Discovery</span><span class="talkrow__speaker" style="display:block"><strong>Scott Clark</strong> · Co-Founder &amp; CEO, Distributional</span><span class="talkrow__summary">The best thing about a black-box optimizer is that it will optimize any eval you give it; the worst thing is that it will *blindly* optimize any eval you give it. So the bottleneck on accelerating science was never optimization power — it's evals that know physics, know the research process, and know how to validate a hypothesis.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal" data-item="" data-slug="aayush-agrawal--evals-the-engine-for-agent-improvement" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">03:00</span><span class="talkrow__main"><span class="talkrow__title">Evals: The Engine for Agent Improvement</span><span class="talkrow__speaker" style="display:block"><strong>Aayush Agrawal</strong> · Product Lead, Uber</span><span class="talkrow__summary">Every agent team rationally decides to ship first and think about evals later, and every one of them ends up trapped in a loop of retrofitting evals and forensically reconstructing why the agent broke. Uber's platform team spent a year making evals the default — tracing on from day one, starter-kit evaluators pushed into Slack, CLI experiences that let product teams own the process — and replaced the question "is your eval above 90%?" with "do you actually trust your eval?"</span></span><span class="badge badge--talk">Talk</span></button></section>
