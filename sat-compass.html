<header class="pagehead reveal is-in" style="--reveal-delay: 0ms;"><p class="kicker">Saturday, August 1</p><h1>Compass Stage</h1><div class="pagehead__meta"><span>19 talks · 3 sessions</span><a href="https://www.youtube.com/watch?v=IBpR4uYftLY" target="_blank" rel="noopener"><span class="material-symbols-rounded" aria-hidden="true">play_circle</span>Morning stream</a><a href="https://www.youtube.com/watch?v=AO0RXP-fVZQ" target="_blank" rel="noopener"><span class="material-symbols-rounded" aria-hidden="true">play_circle</span>Afternoon stream</a></div></header><div class="controls"><div class="searchwrap"><span class="material-symbols-rounded" aria-hidden="true">search</span><input id="search" type="search" placeholder="Search talks, speakers, topics…" value="" aria-label="Search talks, speakers, topics…"></div><div class="chiprow"><button class="chip active" data-filter="all" aria-pressed="true">All</button><button class="chip" data-filter="keynote" aria-pressed="false">Keynote</button><button class="chip" data-filter="talk" aria-pressed="false">Talk</button><button class="chip" data-filter="workshop" aria-pressed="false">Workshop</button><span class="result-count">19 / 19 talks</span></div></div><section class="session-group"><div class="session-head"><span class="session-head__half">AM</span><span class="session-head__label">Session 1: AI Systems</span></div><button class="card talkrow reveal is-in" data-item="" data-slug="ion-stoica--the-limits-of-ai-coding-agents" type="button" style="--reveal-delay: 45ms;"><span class="talkrow__time">00:00</span><span class="talkrow__main"><span class="talkrow__title">The Limits of AI Coding Agents: Two Fundamental Gaps in Agentic Software Engineering</span><span class="talkrow__speaker" style="display:block"><strong>Ion Stoica</strong> · Co-Founder, Databricks and Anyscale; Professor, UC Berkeley</span><span class="talkrow__summary">AI coding agents haven't upended software and systems development because of two gaps that can only be narrowed, never certified closed — the requirement gap (user intent is broader than written requirements) and the model gap (the real world is broader than the development model) — and agents make both worse through context asymmetry, speed, and scale, which is exactly what reward hacking is.</span></span><span class="badge badge--keynote">Keynote</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="nick-harris--photonics-is-the-future-of-computing" type="button" style="--reveal-delay: 90ms;"><span class="talkrow__time">00:24</span><span class="talkrow__main"><span class="talkrow__title">Photonics Is the Future of Computing</span><span class="talkrow__speaker" style="display:block"><strong>Nick Harris</strong> · Founder/CEO, Lightmatter</span><span class="talkrow__summary">AI's growth curve is outrunning the US power grid, and the real bottleneck is interconnect rather than compute; Lightmatter uses light to fuse thousands of GPUs into a single brain, approximating zero latency and infinite bandwidth to deliver 3× faster training and 11× decode interactivity.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="gosia-steinder--beyond-harnesses" type="button" style="--reveal-delay: 135ms;"><span class="talkrow__time">00:33</span><span class="talkrow__main"><span class="talkrow__title">Beyond Harnesses – Platform Solutions for Agent Reliability, Security, and Efficiency</span><span class="talkrow__speaker" style="display:block"><strong>Gosia Steinder</strong> · IBM Fellow, IBM Research</span><span class="talkrow__summary">Agent reliability, security, and efficiency are currently solved bespoke inside application-layer harnesses, but history (Unix/POSIX, containers/Kubernetes) says the industry consolidates onto a new operating system layer — and IBM Research is building that layer as an interception tier that pulls control functions out of agent business logic.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="tim-hockin--is-kubernetes-good-for-agents" type="button" style="--reveal-delay: 180ms;"><span class="talkrow__time">00:44</span><span class="talkrow__main"><span class="talkrow__title">Is Kubernetes Good for Agents? Infrastructure Solutions for Agent-Shaped Problems</span><span class="talkrow__speaker" style="display:block"><strong>Tim Hockin</strong> · Distinguished Engineer, Google</span><span class="talkrow__summary">Agents are bursty, untrusted, single-tenant, and latency-sensitive — precisely the opposite of what Kubernetes was designed for. Google's open-source Agent Substrate doesn't rebuild Kubernetes; it layers an aggressively suspend/resume-based actor runtime on top, turning tens of seconds to tens of minutes of idle into sub-second wake-ups.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="workshop--why-your-ai-agent-needs-a-wallet" type="button" style="--reveal-delay: 225ms;"><span class="talkrow__time">01:02</span><span class="talkrow__main"><span class="talkrow__title">Why Your AI Agent Needs a Wallet: Agentic commerce on Arc with USDC and Nanopayments</span><span class="talkrow__speaker" style="display:block"><strong>Harshal Bhangale</strong> · Staff Software Engineer, Circle</span><span class="talkrow__summary">What stops agents today usually isn't model capability but payment — they hand control back to you the moment they hit a paywall or a signup flow. Give an agent its own budget-capped wallet plus x402 + USDC pay-per-call, and it can buy what it needs on its own.</span></span><span class="badge badge--workshop">Workshop</span></button></section><section class="session-group"><div class="session-head"><span class="session-head__half">PM</span><span class="session-head__label">Session 2: Frameworks &amp; Dev Platforms</span></div><button class="card talkrow reveal is-in" data-item="" data-slug="wenbo-guo--opensage-next-generation-of-agentic-ai" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">00:03</span><span class="talkrow__main"><span class="talkrow__title">OpenSage: Next Generation of Agentic AI</span><span class="talkrow__speaker" style="display:block"><strong>Wenbo Guo</strong> · Assistant Professor, UCSB</span><span class="talkrow__summary">Every agent framework today makes a human pre-specify topology, toolset, and memory structure — which is exactly the "feature engineering" deep learning made obsolete a decade ago. OpenSage ships only a minimal scaffold and lets the agent spawn its own sub-agents, write its own tools, and design its own memory: what the speaker calls agent 2.0.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="ramesh-raskar--the-agentic-web-and-the-bazaar-era-of-ai" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">00:13</span><span class="talkrow__main"><span class="talkrow__title">The Agentic Web and the Bazaar Era of AI</span><span class="talkrow__speaker" style="display:block"><strong>Ramesh Raskar</strong> · Professor, MIT</span><span class="talkrow__summary">AI is shifting from a factory era — a few large companies mass-producing what we consume — to a bazaar era of edge models running everywhere. Once billions of agents are on the open web, the decisive question isn't whose model is best but who builds the infrastructure, because whoever builds it will own it.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="shiva-kasiviswanthan--toward-adaptive-agent-frameworks" type="button" style="--reveal-delay: 0ms;"><span class="talkrow__time">00:23</span><span class="talkrow__main"><span class="talkrow__title">Toward Adaptive Agent Frameworks</span><span class="talkrow__speaker" style="display:block"><strong>Shiva Kasiviswanthan</strong> · Principal Applied Scientist, Amazon Web Services</span><span class="talkrow__summary">Today's agents plan and use tools well, but their execution policy is hard-coded. For mission-critical deployment, agents need to learn what to do next under an explicit budget (a constrained MDP), learn to explore several reasoning paths in parallel, and keep adapting to new tasks without forgetting old ones.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="tanya-roosta--information-retrieval-in-the-age-of-agentic-ai" type="button" style="--reveal-delay: 45ms;"><span class="talkrow__time">00:29</span><span class="talkrow__main"><span class="talkrow__title">Information Retrieval in the Age of Agentic AI</span><span class="talkrow__speaker" style="display:block"><strong>Tanya Roosta</strong> · Director of AI, AMD; Berkeley alumna</span><span class="talkrow__summary">The unit of work in retrieval has moved from a lookup to an ongoing conversation with the world — yet we still grade the final answer with BLEU and ROUGE. Evaluation has to move to the trace: the correctness of every hop, whether each hop was adequate, and the cost in tokens and latency.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="denis-akhiyarov--are-small-llms-ready-for-coding-agents" type="button" style="--reveal-delay: 90ms;"><span class="talkrow__time">00:37</span><span class="talkrow__main"><span class="talkrow__title">Are Small LLMs Ready for Coding Agents?</span><span class="talkrow__speaker" style="display:block"><strong>Denis Akhiyarov</strong> · Senior Staff AI Scientist, ServiceNow</span><span class="talkrow__summary">Shrink the harness to a single file, minimize context, take one tiny action at a time and verify it immediately — and a local small LLM really can do most of a realistic coding task. What it can't do is close the verification loop.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="nilou-salehi--agent-learning-requires-compressing-information" type="button" style="--reveal-delay: 135ms;"><span class="talkrow__time">00:43</span><span class="talkrow__main"><span class="talkrow__title">Agent Learning Requires Compressing Information into an Executable Reasoning Structure</span><span class="talkrow__speaker" style="display:block"><strong>Nilou Salehi</strong> · Associate Professor, UC Berkeley</span><span class="talkrow__summary">A model and a harness are doing the same thing — compressing large amounts of information into something executable. For enterprise processes that must run repeatedly with high consistency and explainability, the right executable form is a reasoning graph that an agent builds for itself.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="johann-schleier-smith--systems-foundations-for-agentic-ai" type="button" style="--reveal-delay: 180ms;"><span class="talkrow__time">00:49</span><span class="talkrow__main"><span class="talkrow__title">Systems Foundations for Agentic AI</span><span class="talkrow__speaker" style="display:block"><strong>Johann Schleier-Smith</strong> · Senior Staff Engineer, Temporal</span><span class="talkrow__summary">What eats your time building agents isn't the core functionality but the cross-cutting concerns — retries, queuing, state management. Durable execution separates systems logic from business logic so you can write crash-proof agents in ordinary code. And more agency isn't always better: good abstractions let you slide up and down the agency spectrum without a rewrite.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="workshop--build-ai-agents-that-survive-failure" type="button" style="--reveal-delay: 225ms;"><span class="talkrow__time">00:59</span><span class="talkrow__main"><span class="talkrow__title">Build AI Agents That Survive Failure</span><span class="talkrow__speaker" style="display:block"><strong>Nikolay Advolodkin</strong> · Senior Staff Developer Advocate, Temporal</span><span class="talkrow__summary">Put the agent's business flow in a workflow, wrap every non-deterministic thing that can fail — LLM calls, APIs, database queries — in an activity, and Temporal keeps the history, retries indefinitely, and resumes as though the failure never happened. Demonstrated live by pulling the plug on the weather API.</span></span><span class="badge badge--workshop">Workshop</span></button></section><section class="session-group"><div class="session-head"><span class="session-head__half">PM</span><span class="session-head__label">Session 3: Foundational Capabilities</span></div><button class="card talkrow reveal is-in" data-item="" data-slug="doga-kerestecioglu--mindful-agents-human-inspired-memories-for-long-horizon-tasks" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">02:00</span><span class="talkrow__main"><span class="talkrow__title">Mindful Agents: Human-Inspired Memories for Long-Horizon Tasks</span><span class="talkrow__speaker" style="display:block"><strong>Doga Kerestecioglu</strong> · Principal Applied Scientist, Microsoft Corporation</span><span class="talkrow__summary">Agents have no storage constraint, and that is exactly why they never learned to distill; Microsoft's Fabric AI team borrows the human memory life cycle — ingest, consolidate, forget, retrieve, reconsolidate — to build memory for long-running agents over high-volume streaming data, and argues such systems need three distinct layers of evaluation: retention, retrieval, and task completion.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="ian-fischer--an-optimization-perspective-on-recursive-self-improvement" type="button" style="--reveal-delay: 270ms;"><span class="talkrow__time">02:10</span><span class="talkrow__main"><span class="talkrow__title">An Optimization Perspective on Recursive Self-Improvement</span><span class="talkrow__speaker" style="display:block"><strong>Ian Fischer</strong> · Co-CEO, Poetiq</span><span class="talkrow__summary">Real recursive self-improvement requires both the *recursive* and the *self* to hold; treating the LLM as one component of a broader system rather than the sole improvement target lets you build self-optimizing optimizers whose every RSI step costs one inference run instead of one training run.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="yu-su--intelligence-plus-continual-learning-equals-expertise" type="button" style="--reveal-delay: 0ms;"><span class="talkrow__time">02:21</span><span class="talkrow__main"><span class="talkrow__title">Intelligence + Continual Learning = Expertise</span><span class="talkrow__speaker" style="display:block"><strong>Yu Su</strong> · CEO, NeoCognition; Associate Professor, OSU</span><span class="talkrow__summary">Intelligence (the capacity to solve problems) and expertise (accumulated, situated competence in a specific environment) are largely orthogonal axes; modern society is millions of micro-worlds each with its own local physics, which no static model can compress, so expertise has to be grown on the job through continual learning — and that axis, not raw intelligence, is the next dimension for scaling.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="furong-huang--reasoning-as-control-adaptive-test-time-compute-for-planning-agents" type="button" style="--reveal-delay: 45ms;"><span class="talkrow__time">02:33</span><span class="talkrow__main"><span class="talkrow__title">Reasoning as Control: Adaptive Test-Time Compute for Planning Agents</span><span class="talkrow__speaker" style="display:block"><strong>Furong Huang</strong> · Associate Professor, University of Maryland</span><span class="talkrow__summary">Self-improvement is usually framed as a model capability, but the model is only one layer; foundation models are increasingly runtime decision makers, and a self-improving agentic system can be improved at three levels — thinking (token-level decoding control), action (genuine self-reflection rather than imitating a stronger model), and workflow (retrieving a topology from a pre-computed bank at test time) — all without retraining the model.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="raja-giryes--on-the-visual-capabilities-of-multimodal-models" type="button" style="--reveal-delay: 90ms;"><span class="talkrow__time">02:45</span><span class="talkrow__main"><span class="talkrow__title">On the Visual Capabilities of Multimodal Models</span><span class="talkrow__speaker" style="display:block"><strong>Raja Giryes</strong> · Professor, Tel Aviv University</span><span class="talkrow__summary">In today's multimodal models the reasoning happens almost entirely in the LLM while the vision side is a head bolted on, which explains their long lag on spatial cognition; but the two-year jump from near-chance to near-perfect on several tasks shows that asking the right question is itself what drives progress — and the mechanism turns out to be models internally *imagining* visual intermediate states.</span></span><span class="badge badge--talk">Talk</span></button><button class="card talkrow reveal is-in" data-item="" data-slug="workshop--the-open-agentic-stack" type="button" style="--reveal-delay: 135ms;"><span class="talkrow__time">02:57</span><span class="talkrow__main"><span class="talkrow__title">The Open Agentic Stack: Building the Future of AI Systems with Open Source, Open Standards and Composability</span><span class="talkrow__speaker" style="display:block"><strong>Matt White, Ben Burtenshaw, Daniel Han Chen, Shang Yang, Romil Bhardwaj</strong> · Matt White (Former Global CTO of AI, Linux Foundation; CTO, PyTorch Foundation); Ben Burtenshaw (Community Engineer, Hugging Face); Daniel-Han Chen (Co-Founder, Unsloth); Shang Yang (RadixArk); Romil Bhardwaj (Co-Founder and CPO, SkyPilot)</span><span class="talkrow__summary">An agent is not a model, it's a stack — model, harness, tools, environment, guardrails, the RL systems that improve it, the evaluation infrastructure that measures it, and the compute it all runs on. Close and vertically control any one layer and the whole ecosystem becomes less portable, less competitive, and more fragile. Four talks work through four of those layers: environments (OpenEnv), models (Unsloth), reinforcement learning (Miles), and compute (SkyPilot).</span></span><span class="badge badge--workshop">Workshop</span></button></section>
